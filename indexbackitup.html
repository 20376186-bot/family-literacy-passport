<style>
:root{--navy:#073b5c;--cream:#fffaf0;--ink:#18324a;--muted:#607287;--gold:#ffbd3f;--paper:#f0e9dc;--orange:#f15a3c;--teal:#2fa7a5;--green:#58a56b;--blue:#4ba2d0;--pink:#d84b79;--line:#dfd1b8}

header{height:74px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:850}.spark{width:40px;height:40px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center}
nav{display:flex;gap:8px}.navbtn{border:0;background:transparent;color:white;padding:12px 17px;border-radius:28px;font-weight:800}.navbtn.active{background:#ffffff22}.count{background:var(--gold);color:var(--navy);border-radius:20px;padding:4px 9px;margin-left:5px}
main{max-width:1420px;margin:auto;padding:32px 28px 60px}.hero{border-radius:38px;background:radial-gradient(circle at 25% 20%,#135777,#073a5a 52%,#102d4d);color:white;padding:55px 60px;box-shadow:0 14px 35px #142d4122;overflow:hidden}
.hero-inner{display:flex;justify-content:space-between;align-items:center;gap:40px}.eyebrow{letter-spacing:6px;font-weight:900;color:var(--gold)}h1{font-size:clamp(50px,7vw,88px);line-height:.95;margin:24px 0;letter-spacing:-3px}.tagline{font-size:26px;font-weight:850}.subtag{font-size:19px;font-style:italic;color:#d7e1e9;margin-top:12px}
.progressbox{width:400px;background:#294a69dd;border:1px solid #ffffff2b;border-radius:28px;padding:28px}.bigcount{font-size:62px;font-weight:900}.bigcount span{color:var(--gold)}.smallcaps{font-size:14px;font-weight:900;letter-spacing:2px}.bar{height:14px;background:#ffffff25;border-radius:20px;overflow:hidden;margin:18px 0 22px}.bar>div{height:100%;background:var(--gold);transition:.4s}.primary{border:0;background:var(--gold);color:#082d48;font-weight:900;border-radius:30px;padding:15px 24px;font-size:18px}

.activity{margin-top:30px;border:2px dashed #d9cbb5;border-radius:24px;padding:38px;text-align:center}.activity h3{font-size:28px;margin:8px 0}.activity p{color:#53687b;font-size:18px}
.lower{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:30px}.panel{background:#fffdf8;border:1px solid var(--line);border-radius:27px;padding:25px}.panel h3{margin:0;font-size:26px}.panelhead{display:flex;justify-content:space-between;align-items:center}.tasks{margin-top:18px;display:grid;gap:11px}.task{border:2px solid #e0d3bd;border-radius:17px;padding:14px;display:flex;align-items:center;gap:11px}.task.done{background:#f1f8f0;border-color:#9bc6a4}.check{width:40px;height:40px;border:2px solid #d8cbb5;border-radius:50%;display:grid;place-items:center;flex:none}.done .check{background:var(--green);border-color:var(--green);color:white}.tasktext{font-weight:750;flex:1}.done .tasktext{text-decoration:line-through;color:#698071}.task button{border:0;background:#05658a;color:white;border-radius:22px;padding:9px 13px;font-weight:850}.task.done button{background:#dcebdc;color:#367247}
.reflect{margin-top:18px;display:grid;gap:14px}.q{background:var(--paper);border-radius:19px;padding:17px}.qhead{font-weight:850;font-size:17px;margin-bottom:9px}.num{display:inline-grid;place-items:center;width:29px;height:29px;border-radius:50%;color:white;margin-right:7px}.q:nth-child(1) .num{background:var(--orange)}.q:nth-child(2) .num{background:var(--teal)}.q:nth-child(3) .num{background:var(--green)}textarea{width:100%;min-height:78px;border:2px solid #d9cbb7;border-radius:15px;background:#fffdf8;padding:11px;resize:vertical;color:var(--ink)}.saved{font-size:13px;color:#607287}.stampwrap{display:flex;justify-content:center;padding:25px}.stamp{width:190px;height:190px;border:6px double var(--gold);border-radius:50%;display:grid;place-items:center;text-align:center;background:#fff9e9;transform:rotate(-6deg);font-weight:900}.stamp small{display:block;letter-spacing:3px}.stamp strong{display:block;font-size:25px}
.celebrate{position:fixed;inset:0;background:#073b5cdd;display:none;place-items:center;z-index:50}.celebrate.show{display:grid}.modal{background:#fffdf8;border-radius:28px;padding:42px;max-width:510px;text-align:center}.modal h2{font-size:43px;margin:0 0 8px}.modal p{font-size:19px;color:#526579}.close{border:0;background:var(--gold);padding:13px 24px;border-radius:24px;font-weight:900}canvas{position:fixed;inset:0;pointer-events:none;z-index:60}

.pathgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:20px}.pathbtn{border:2px solid #d9cbb7;background:#fffdf8;border-radius:18px;padding:17px;text-align:left;font-weight:850;color:var(--ink)}.pathbtn:hover,.pathbtn.selected{border-color:var(--orange);background:#fff4ee}.pathbtn small{display:block;color:#607287;font-weight:600;margin-top:5px}.story{margin-top:28px;background:#f7f1e7;border-radius:25px;padding:28px}.story h3{font-size:30px;margin:0 0 12px}.story p{font-size:19px;line-height:1.65}.story.supported p{line-height:1.85}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;margin-top:20px}.choice{border:2px solid #d8cbb5;background:#fffdf8;border-radius:17px;padding:16px;text-align:left;font-weight:800;color:var(--ink)}.choice:hover{border-color:var(--teal);transform:translateY(-1px)}.choice.correct{border-color:var(--green);background:#eef8ef}.choice.incorrect{border-color:#d9a4a4;background:#fff2f2}.feedback{margin-top:15px;padding:14px 16px;border-radius:15px;background:#eaf5f3;font-weight:750}.toolrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.tool{border:1px solid #c8bba7;background:#fff;border-radius:22px;padding:9px 14px;font-weight:800;color:#36546b}.accessnote{font-size:15px;color:#607287;margin-top:8px}.branch{margin-top:25px;border-left:5px solid var(--teal);padding:4px 0 4px 18px}.social{background:#eef3f8;border:1px solid #cdd9e5;border-radius:20px;padding:18px;margin:12px 0;text-align:left}.social strong{display:block}.social p{margin:8px 0;font-size:16px}.evidence{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}.evidence button{border:2px solid #d9cbb7;background:#fffdf8;border-radius:15px;padding:14px;text-align:left;font-weight:750}.reflectionchoices{display:flex;flex-wrap:wrap;gap:10px}.reflectionchoices button{border:2px solid #d9cbb7;background:#fffdf8;border-radius:24px;padding:11px 15px;font-weight:800}.reflectionchoices button.selected{background:#eaf5f3;border-color:var(--teal)}.completionbox{margin-top:28px;border:2px solid var(--gold);background:#fff9e9;border-radius:24px;padding:24px;text-align:center}.mutedline{color:#607287;font-size:16px}.largechoice{font-size:18px}
.cardart{min-height:112px;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:46px;background:linear-gradient(135deg,#fff7ea,#f1e6d4);border-bottom:1px solid var(--line)}.cardart.imageart{display:block;padding:0;position:relative;height:190px;overflow:hidden}.cardart.imageart img{width:100%;height:100%;object-fit:cover;object-position:center;border:0;display:block}.cardart.imageart .artlabel{position:absolute;left:14px;bottom:12px;background:#fffdf8ee;border-radius:14px;padding:8px 11px;font-size:14px;font-weight:900;color:var(--ink);box-shadow:0 5px 16px #18324a22}.cardart small{font-size:15px;line-height:1.25;text-align:right;font-weight:850;color:#506579;max-width:145px}.theme-0 .cardart{background:linear-gradient(135deg,#f7e2bd,#e8c58d 55%,#d9b27a)}.theme-1 .cardart{background:linear-gradient(135deg,#edf5f7,#dbeaf0 55%,#c8dce5)}.theme-2 .cardart{background:linear-gradient(135deg,#fff5cf,#f5df9d 55%,#ead08a)}.theme-3 .cardart{background:linear-gradient(135deg,#fde8ed,#f5cbd5 55%,#efb9c6)}.theme-4 .cardart{background:linear-gradient(135deg,#e6f2e7,#cfe6d3 55%,#b8d7bf)}.theme-5 .cardart{background:linear-gradient(135deg,#e7f1fa,#cfe2f1 55%,#b8d5e9)}.theme-6 .cardart{background:linear-gradient(135deg,#f5e8dc,#ead1bc 55%,#dec0a3)}.theme-7 .cardart{background:linear-gradient(135deg,#fff0c9,#ffe1a0 55%,#ffd07b)}.themehint{margin-top:10px;color:#718094;font-size:13px;font-weight:750;line-height:1.35}.experience.november-theme{background:linear-gradient(180deg,#fffdf8 0%,#fff8ee 65%,#f6ead9 100%)}.november-hero{margin:-10px -58px 30px;position:relative;height:300px;overflow:hidden}.november-hero img{width:100%;height:100%;object-fit:cover;object-position:center bottom;display:block}.november-hero .herooverlay{position:absolute;inset:0;background:linear-gradient(180deg,#073b5c00 45%,#073b5c66 100%)}.november-hero .herotext{position:absolute;left:32px;bottom:24px;color:white;text-shadow:0 2px 8px #102d4dcc}.november-hero .herotext .eyebrow{font-size:13px;letter-spacing:3px;color:#fff}.november-hero .herotext h2{font-size:42px;line-height:1;margin:7px 0}.november-hero .herotext p{margin:0;font-size:19px;font-weight:750}.pathcards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:22px}.pathcard{border:2px solid #d9cbb7;background:#fffdf8;border-radius:20px;overflow:hidden;padding:0;text-align:left;color:var(--ink);font-weight:850;box-shadow:0 6px 18px #18324a12}.pathcard:hover{transform:translateY(-2px);border-color:var(--orange)}.pathcard img{width:100%;height:125px;object-fit:cover;display:block}.pathcard .pathcopy{padding:13px 15px}.pathcard strong{display:block;font-size:19px}.pathcard small{display:block;color:#607287;font-weight:650;margin-top:4px;line-height:1.35}.house-materials{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.materialbtn{border:2px solid #d9cbb7;background:#fffdf8;border-radius:17px;padding:15px;text-align:left;font-weight:850;color:var(--ink);display:flex;gap:12px;align-items:center}.materialbtn:hover,.materialbtn.selectedMaterial{border-color:var(--orange);background:#fff4ee}.material-swatch{width:38px;height:38px;border-radius:10px;display:block;flex:none;box-shadow:inset 0 0 0 2px #18324a18}.swatch-straw{background:repeating-linear-gradient(45deg,#d7bd67 0 5px,#ead88d 5px 9px)}.swatch-sticks{background:repeating-linear-gradient(25deg,#9a6845 0 5px,#c28a5e 5px 9px)}.swatch-bricks{background:repeating-linear-gradient(0deg,#c96d5b 0 10px,#e1a092 10px 12px),repeating-linear-gradient(90deg,transparent 0 18px,#fff3 18px 20px)}.materialbtn small{display:block;color:#607287;font-weight:650;margin-top:3px}.noemoji{font-size:inherit}.reflectionmark{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.reflectionmark span{border:2px solid #d8cbb5;border-radius:14px;padding:8px 12px;font-weight:900;letter-spacing:1px;color:#36546b;background:#fffdf8}.experience.november-theme .exphead{background:linear-gradient(90deg,#9a5634,#b66a3c,#d39a55)}.experience.november-theme .welcome{background:linear-gradient(135deg,#f8ead4,#f0dfc5)}.experience.november-theme .story{background:linear-gradient(135deg,#fbf0df,#f2e2cc)}
@media(max-width:650px){.pathgrid,.choices,.evidence,.pathcards,.house-materials{grid-template-columns:1fr}.story{padding:21px}.november-hero{margin:-8px -20px 24px;height:230px}.november-hero .herotext{left:18px;bottom:17px}.november-hero .herotext h2{font-size:30px}.november-hero .herotext p{font-size:16px}.pathcard img{height:150px}}
</style></head>
<body>
<header><div class="brand"><div class="spark">✦</div>Family Literacy Passport</div><nav><button class="navbtn active" onclick="home()">Passport</button><button class="navbtn" onclick="stamps()">Stamps <span class="count" id="count">0/8</span></button></nav></header>
<main id="app"></main>
<div class="celebrate" id="celebrate"><div class="modal"><div id="icon" style="font-size:60px">🎉</div><h2 id="ctitle">Nice work!</h2><p id="ctext">You completed a task.</p><button class="close" onclick="closeCelebrate()">Continue</button></div></div><canvas id="confetti"></canvas>
<script>
const appEl=document.getElementById("app");
const countEl=document.getElementById("count");
const celebrateEl=document.getElementById("celebrate");
const iconEl=document.getElementById("icon");
const ctitleEl=document.getElementById("ctitle");
const ctextEl=document.getElementById("ctext");
const ex=[
["November 18, 2026","Literacy Is Access","Same goal. Different paths.","Discover the many ways your child can take in information and use it to decide what to do next.","#b66a3c","🍂","A Story With Many Paths","Forest paths • warm autumn light • straw, sticks & bricks"],
["December 16, 2026","Literacy in My World","Literacy is everywhere.","Spot signs, labels, menus and symbols in everyday places.","#477b91","❄️","Winter in My World","Lights • stars • celebrations • traditions"],
["January 20, 2027","Choose Your Literacy","Choice increases engagement.","Explore what your child loves to read, watch, and hear.","#c99a32","✨","New Year, New Choices","Fresh starts • possibilities • choosing your path"],
["February 17, 2027","Read It. Do It.","Literacy helps us do things.","Follow a recipe, a map, or a set of steps together.","#c55d72","💕","Love, Kindness & Helping Others","Connection • kindness • doing something for someone"],
["March 24, 2027","Everyone Has a Voice","Communication is access.","Celebrate every way your child communicates.","#5b9b72","🎤","Find Your Voice","Expression • communication • ideas • being heard"],
["April 21, 2027","Find What Works","Tools can increase access.","Try tools and supports that open doors to information.","#5b8fc1","🧩","Find Your Way","Paths • maps • tools • different ways to get there"],
["May 19, 2027","Literacy for My Future","Literacy supports independence.","Connect literacy to work, community, and independent living.","#b27b55","🚪","What's Next?","Doors • destinations • work • community • possibility"],
["June 16, 2027","Our Literacy Stories","Everyone has a literacy story.","Share and celebrate your family's year of discovery.","#e29b4b","☀️","Look How Far We've Come","Summer • memories • celebration • your literacy story"]
];
const tasks=["Participate in the November literacy experience","Try the activity with your child","Explore a different way to access information","Complete the family reflection"];
let state=JSON.parse(localStorage.getItem("flp")||'{"tasks":[false,false,false,false],"reflection":["","",""],"complete":false,"path":"","storyStep":0,"supported":false,"houseBlocks":[],"houseReason":""}');
state.houseBlocks=state.houseBlocks||[];state.houseReason=state.houseReason||'';
const save=()=>localStorage.setItem("flp",JSON.stringify(state));
const esc=s=>String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
function nav(){countEl.textContent=(state.complete?1:0)+"/8"}
function home(){nav();appEl.innerHTML=`<section class="hero"><div class="hero-inner"><div><div class="eyebrow">HAWAIʻI · 2026–2027</div><h1>Family<br>Literacy<br>Passport</h1><div class="tagline">Explore • Experience • Grow</div><div class="subtag">A Year of Discovery Through Literacy</div></div><div class="progressbox"><div class="bigcount"><span>${state.complete?1:0}</span> / 8</div><div class="smallcaps">EXPERIENCES COMPLETE</div><div class="bar"><div style="width:${state.complete?12.5:0}%"></div></div><button class="primary" onclick="openOctober()">${state.complete?"Review November":"Start November"} →</button></div></div></section><div class="sectionhead"><h2>Your passport stops</h2><p>Same goal. Different paths.</p></div><section class="grid">${ex.map((e,i)=>`<article class="card theme-${i}"><div class="cardtop" style="background:${e[4]}"><span>STOP ${i+1}</span><span>${i+1}</span></div>${i===0?`<div class="cardart imageart"><img src="assets/november-hero-art.jpg" alt="Three pigs exploring a lush island path"><div class="artlabel">A Story With Many Paths</div></div>`:`<div class="cardart"><small style="max-width:none;text-align:left;font-size:18px">${e[6]}</small></div>`}<div class="cardbody"><div class="date">${e[0]}</div><h3>${e[1]}</h3><p class="quote" style="color:${e[4]}">“${e[2]}”</p><p class="desc">${e[3]}</p><div class="themehint">${e[7]}</div>${i===0?`<button class="status ready" onclick="openOctober()">${state.complete?"Completed ✓":"Start November →"}</button>`:`<button class="status">Coming soon</button>`}</div></article>`).join("")}</section>`}
function openOctober(){
  renderExperience();
}
function renderExperience(){
  const p=state.path||'';
  const step=state.storyStep||0;
  appEl.innerHTML=`<button class="back" onclick="home()">← Passport home</button>
  <section class="experience november-theme"><div class="exphead"><span>NOVEMBER 18, 2026</span><span>Stop 1 of 8</span></div><div class="expbody">
  <div class="november-hero"><img src="assets/november-hero-art.jpg" alt="Three little pigs exploring a lush island path with mountains and ocean"><div class="herooverlay"></div><div class="herotext"><div class="eyebrow">NOVEMBER · STOP 1</div><h2>Literacy Is Access</h2><p>A Story With Many Paths</p></div></div><h1 class="exp-title">Literacy Is Access</h1><div class="quote2">“We all know the story… but do we?”</div>
  <div class="welcome"><h3>CHOOSE YOUR PATH</h3><strong>The Three Little Pigs</strong><p>You've probably heard the story. Today, you're going to explore it, make choices, and see how a story can change depending on how we access it and whose perspective we hear.</p>
  <div class="toolrow"><button class="listen" onclick="speak('We all know the story, but do we? Choose how you want to explore The Three Little Pigs.')">🔊 Listen</button><button class="tool" onclick="toggleSupport()">${state.supported?'Hide':'Show'} access supports</button><button class="tool" onclick="textSize()">Text size</button></div>
  <div class="accessnote">There is no “right” way to participate. Read, listen, use visuals, explore adapted text, talk it through, or use a communication tool—choose what helps you access the story.</div>
  <div class="pathcards">
   <button class="pathcard" onclick="choosePath('read')"><img src="assets/november-pigs-path.jpg" alt="A small house surrounded by tropical greenery"><div class="pathcopy"><strong>Read it</strong><small>Explore the story through text.</small></div></button>
   <button class="pathcard" onclick="choosePath('hear')"><img src="assets/november-wolf-path.jpg" alt="A wolf looking through lush tropical leaves"><div class="pathcopy"><strong>Hear it</strong><small>Listen while you follow along.</small></div></button>
   <button class="pathcard" onclick="choosePath('support')"><img src="assets/november-investigator-path.jpg" alt="A magnifying glass and map on an island path"><div class="pathcopy"><strong>Explore with supports</strong><small>Use visuals, shorter chunks, key words, and cues.</small></div></button>
  </div><div class="toolrow"><button class="tool" onclick="choosePath('together')">Explore with someone</button><span class="accessnote" style="align-self:center">Pause, talk, predict, point, or communicate together.</span></div></div>
  ${p?storyStep(step,p):`<div class="activity"><div style="font-size:45px">🐺</div><div class="smallcaps">YOUR FIRST CHOICE</div><h3>How will you enter the story?</h3><p>Choose a path above. You can change your path at any time.</p></div>`}
  ${state.complete?`<div class="completionbox"><div class="smallcaps">PASSPORT STAMP EARNED</div><div class="stampwrap"><div class="stamp"><div><small>NOVEMBER</small><strong>LITERACY<br>IS ACCESS</strong><small>2026 ✓</small></div></div></div><p style="font-weight:850;font-size:18px">You explored a story, considered different perspectives, and made meaning in your own way. 🎉</p></div>`:''}
  </div></section>`;
  if(state.supported)document.querySelector('.experience')?.classList.add('supported');
}
function choosePath(p){state.path=p;state.storyStep=0;save();renderExperience()}
function toggleSupport(){state.supported=!state.supported;save();renderExperience()}
function textSize(){document.body.classList.toggle('largerText');document.body.style.fontSize=document.body.classList.contains('largerText')?'110%':''}
function storyStep(step,p){
 const content=[
 `<div class="story"><div class="smallcaps">CHAPTER 1 · BUILD YOUR HOUSE</div><h3>If you were building a house, what would you choose?</h3><p>Three little pigs made different choices. Now it’s your turn. Build a house using the materials that make sense to you.</p><div class="toolrow"><button class="listen" onclick="speak('If you were building a house, what would you choose? You can build with straw, sticks, bricks, or a combination.')">🔊 Listen</button><button class="tool" onclick="speak('Straw can be quick and easy. Sticks can be stronger. Bricks can take more time and effort, but they can be sturdy.')">🔊 Hear about the materials</button></div><div class="housebuilder"><div class="smallcaps">CHOOSE YOUR MATERIAL</div><div class="house-materials"><button class="materialbtn ${state.houseMaterial==='straw'?'selectedMaterial':''}" onclick="chooseMaterial('straw')"><span class="material-swatch swatch-straw"></span><span>Straw<small>Quick • light</small></span></button><button class="materialbtn ${state.houseMaterial==='sticks'?'selectedMaterial':''}" onclick="chooseMaterial('sticks')"><span class="material-swatch swatch-sticks"></span><span>Sticks<small>Strong • flexible</small></span></button><button class="materialbtn ${state.houseMaterial==='bricks'?'selectedMaterial':''}" onclick="chooseMaterial('bricks')"><span class="material-swatch swatch-bricks"></span><span>Bricks<small>Sturdy • more work</small></span></button></div><div class="house"><div class="roof"></div><div class="housebody"><div class="door"></div><div class="window"></div></div><div class="blocks">${(state.houseBlocks||[]).map((m,i)=>{const pos=[[68,92],[116,92],[164,92],[68,120],[116,120],[164,120],[92,148],[140,148]];const colors={straw:'#d9bd62',sticks:'#9b6a43',bricks:'#c96d5b'};return `<div class="block" style="left:${pos[i][0]}px;top:${pos[i][1]}px;background:${colors[m]}"></div>`}).join('')}</div></div><div class="househint">${(state.houseBlocks||[]).length<8?'Tap your material to add it to your house. You can mix materials.': 'Your house is built! 🎉'}</div><div class="materialchoice"><button class="tool" onclick="clearHouse()">Start over</button></div></div><div class="branch"><strong>Your choice matters.</strong><br>Maybe you want something fast. Maybe you want something strong. Maybe you have another reason. There can be more than one good reason for a choice.</div><div class="choices">${choiceBtn('I wanted it fast.','house','That makes sense. Time can matter.')} ${choiceBtn('I wanted it strong.','house','That makes sense. Strength can matter.')} ${choiceBtn('I wanted it easy.','house','That makes sense. Effort can matter.')} ${choiceBtn('I had another reason.','house','Tell someone your reason. Your thinking matters.')}</div><div id="fb" class="feedback" style="display:none"></div>${(state.houseBlocks||[]).length>=3?`<button class="primary" style="margin-top:20px" onclick="nextStory(1)">My house is ready →</button>`:''}</div>`,
 `<div class="story"><div class="smallcaps">CHAPTER 2 · THE BEGINNING</div><h3>Once upon a time...</h3><p>Three little pigs set out to build homes of their own. One pig chose straw. Another chose sticks. The third chose bricks.</p><p>Then a wolf arrived.</p><div class="toolrow"><button class="listen" onclick="speak('Three little pigs set out to build homes of their own. One pig chose straw. Another chose sticks. The third chose bricks. Then a wolf arrived.')">🔊 Listen to this part</button></div><div class="branch"><strong>Pause and predict:</strong><br>What do you think the pigs will do when the wolf arrives?</div><div class="choices">${choiceBtn('Build a stronger house','predict','This is one possibility. What makes you think it?')} ${choiceBtn('Run away','predict','That could happen too. Stories can surprise us.')} ${choiceBtn('Talk to the wolf','predict','Interesting choice. What might they say?')} ${choiceBtn('I’m not sure yet','predict','That is a valid response. You can keep reading to find out.')}</div><div id="fb" class="feedback" style="display:none"></div><button class="primary" style="margin-top:20px" onclick="nextStory(2)">Continue →</button></div>`,
 `<div class="story"><div class="smallcaps">CHAPTER 3 · THE WOLF'S SIDE</div><h3>Wait… what did the wolf say?</h3><p>In the familiar version, we mostly hear from the pigs. But what if we stop and listen to another perspective?</p><div class="social"><strong>🐺 @WolfOfficial</strong><p>“I did go to the pigs' houses. But I wasn't trying to hurt anyone. I was hungry, and I wanted to ask for some food.”</p></div><div class="social"><strong>🐷 @ThreeLittlePigs</strong><p>“He came to our houses and blew them down! We were scared.”</p></div><div class="branch"><strong>Think about it:</strong> Two people can experience the same event differently.</div><div class="choices">${choiceBtn('The pigs are definitely telling the truth.','perspective','Maybe. What evidence would help you decide?')} ${choiceBtn('The wolf is definitely telling the truth.','perspective','Maybe. What evidence would help you decide?')} ${choiceBtn('I need more information.','perspective','Excellent. Looking for evidence is part of literacy.')} ${choiceBtn('Both perspectives matter.','perspective','Exactly. We can listen to more than one perspective.')}</div><div id="fb" class="feedback" style="display:none"></div><button class="primary" style="margin-top:20px" onclick="nextStory(3)">Continue →</button></div>`,
 `<div class="story"><div class="smallcaps">CHAPTER 4 · INVESTIGATE</div><h3>What counts as evidence?</h3><p>Now you get to investigate. Which pieces of information would help you understand what really happened?</p><div class="evidence"><button onclick="evidencePick(this,true)">What each character says happened</button><button onclick="evidencePick(this,true)">What happened to the houses</button><button onclick="evidencePick(this,true)">A comment from someone who wasn't there</button><button onclick="evidencePick(this,true)">Your favorite character</button></div><div id="evfb" class="feedback" style="display:none"></div><div class="branch"><strong>For readers ready for more:</strong> Compare two versions of the story. What changed because the narrator changed?</div><div class="toolrow"><button class="listen" onclick="speak('Compare two versions of the story. What changed because the narrator changed?')">🔊 Hear the challenge</button><button class="tool" onclick="speak('Evidence is information that helps us support an idea or understand what happened.')">🔊 Hear the key idea</button></div><button class="primary" style="margin-top:20px" onclick="nextStory(4)">Continue →</button></div>`,
 `<div class="story"><div class="smallcaps">CHAPTER 5 · YOUR VOICE</div><h3>Now tell your version.</h3><p>Imagine the story is going viral. What would you want people to know?</p><div class="social"><strong>📱 BREAKING: THREE HOUSES. ONE WOLF. MANY STORIES.</strong><p>Choose how you want to respond.</p></div><div class="choices">${choiceBtn('Write a headline','create','Example: “Wolf says there is more to the story.”')} ${choiceBtn('Choose the best evidence','create','Pick the detail that supports your view.')} ${choiceBtn('Tell it with pictures or symbols','create','Use images, symbols, or AAC to communicate your idea.')} ${choiceBtn('Talk it through with someone','create','Explain what you think and why.')}</div><div id="fb" class="feedback" style="display:none"></div><div class="branch"><strong>Access matters:</strong> You can show what you understand by writing, speaking, choosing, pointing, using visuals, using AAC, or communicating another way.</div><button class="primary" style="margin-top:20px" onclick="finishExperience()">Continue to family reflection →</button></div>`,
 `<div class="story"><div class="smallcaps">ALMOST THERE · YOUR FAMILY REFLECTION</div><h3>You made it through the story.</h3><p>Before you collect your passport stamp, take a moment to reflect together. There are no right answers.</p><div class="completionbox" style="margin-top:20px"><div class="reflectionmark"><span>HOUSE</span><span>STORY</span><span>VOICE</span></div><h3 style="margin-top:8px">What did you notice?</h3><p class="mutedline">What did your child enjoy, choose, or communicate?</p><textarea oninput="reflection(0,this.value)" placeholder="Type, dictate, or talk about it…">${esc(state.reflection[0]||'')}</textarea><p class="mutedline" style="margin-top:18px">What helped your child access the experience?</p><textarea oninput="reflection(1,this.value)" placeholder="Audio, visuals, choices, talking together, something else…">${esc(state.reflection[1]||'')}</textarea><p class="mutedline" style="margin-top:18px">Anything else you want to remember?</p><textarea oninput="reflection(2,this.value)" placeholder="A moment, idea, question, or celebration…">${esc(state.reflection[2]||'')}</textarea></div><div class="completionbox" style="margin-top:20px"><div class="smallcaps">YOUR PASSPORT STAMP</div><p style="font-weight:850;font-size:18px">Save your reflection to collect it.</p><button class="primary" onclick="finishReflection()">Save reflection & earn my stamp →</button></div></div>`
 ];
 return content[Math.min(step,5)];
}
function chooseMaterial(m){if((state.houseBlocks||[]).length>=8)return;state.houseMaterial=m;state.houseBlocks=state.houseBlocks||[];state.houseBlocks.push(m);save();renderExperience()}
function clearHouse(){state.houseBlocks=[];state.houseMaterial='';save();renderExperience()}

function choiceBtn(label,type,feedback){return `<button class="choice largechoice" onclick="choiceFeedback(this,'${type}',${JSON.stringify(feedback)})">${label}</button>`}
function choiceFeedback(btn,type,msg){btn.parentElement.querySelectorAll('.choice').forEach(b=>b.classList.remove('correct','incorrect'));btn.classList.add('correct');const f=btn.parentElement.parentElement.querySelector('#fb');if(f){f.style.display='block';f.textContent=msg}popSound()}
function evidencePick(btn,good){btn.classList.add('correct');const f=document.getElementById('evfb');f.style.display='block';f.textContent='Yes. Evidence gives us information we can use to understand a story and support our thinking.';popSound()}
function nextStory(n){state.storyStep=n;save();renderExperience();window.scrollTo({top:0,behavior:'smooth'})}
function finishExperience(){state.storyStep=5;state.tasks[0]=true;save();renderExperience();window.scrollTo({top:0,behavior:'smooth'})}

function reflection(i,v){state.reflection[i]=v;save()}
function finishReflection(){state.tasks[3]=true;state.complete=true;save();applauseSound();confetti(180);setTimeout(()=>celebrate(),250)}
function celebrate(){confetti(180);iconEl.textContent="🏅";ctitleEl.textContent="November complete!";ctextEl.innerHTML=`You earned your first passport stamp!<div class="stampwrap" style="padding:18px"><div class="stamp" style="margin:auto"><div><small>NOVEMBER</small><strong>LITERACY<br>IS ACCESS</strong><small>2026 ✓</small></div></div></div><strong>Progress: 1 / 8</strong>`;celebrateEl.classList.add("show")}
function closeCelebrate(){celebrateEl.classList.remove("show");openOctober()}
function resetTestPassport(){if(!confirm("Reset this browser\'s Family Literacy Passport test progress back to 0/8?"))return;localStorage.removeItem('flp');state={tasks:[false,false,false,false],reflection:['','',''],complete:false,path:'',storyStep:0,supported:false,houseBlocks:[],houseMaterial:'',houseReason:''};home()}
function stamps(){appEl.innerHTML=`<button class="back" onclick="home()">← Passport home</button><section class="panel"><h2 style="font-size:42px">Your passport stamps</h2><p style="color:#607287;font-size:18px">Each completed experience earns a digital stamp.</p><div class="stampwrap">${state.complete?'<div class="stamp"><div><small>NOVEMBER</small><strong>LITERACY<br>IS ACCESS</strong><small>2026 ✓</small></div></div>':'<div class="stamp" style="opacity:.4"><div><small>NOVEMBER</small><strong>LOCKED</strong><small>Complete the experience</small></div></div>'}</div><div style="text-align:center;margin-top:18px"><button onclick="resetTestPassport()" style="border:1px solid #d9cbb7;background:#fffaf0;color:#607287;border-radius:22px;padding:10px 16px;font-weight:750">Reset this test passport</button><p style="font-size:13px;color:#8a8a8a;margin:9px 0 0">For testing only. Resets progress saved on this browser.</p></div></section>`}
let speechTimer=null;
function speak(t){
  if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){alert('Audio is not available in this browser. Try Chrome or Safari.');return}
  const synth=window.speechSynthesis;
  if(speechTimer)clearTimeout(speechTimer);
  synth.cancel();
  const play=()=>{
    const u=new SpeechSynthesisUtterance(t);
    u.lang='en-US';
    u.rate=0.92;
    u.pitch=1;
    const voices=synth.getVoices();
    const v=voices.find(v=>v.lang&&v.lang.toLowerCase()==='en-us')||voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('en'));
    if(v)u.voice=v;
    u.onstart=()=>{};
    u.onerror=()=>alert('The browser could not start the audio. Please try the Listen button again.');
    synth.resume();
    synth.speak(u);
    speechTimer=setTimeout(()=>{if(!synth.speaking)synth.speak(u)},700);
  };
  if(synth.getVoices().length) play();
  else {
    const old=synth.onvoiceschanged;
    synth.onvoiceschanged=()=>{synth.onvoiceschanged=old||null;play()};
    speechTimer=setTimeout(play,800);
    synth.getVoices();
  }
}
function audioCtx(){window.__flpAudio=window.__flpAudio||new (window.AudioContext||window.webkitAudioContext)();if(window.__flpAudio.state==='suspended')window.__flpAudio.resume();return window.__flpAudio}
function popSound(){try{const c=audioCtx(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type='sine';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(900,t+.09);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.13);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.14)}catch(e){}}
function applauseSound(){try{const c=audioCtx(),t=c.currentTime;for(let i=0;i<7;i++){const b=c.createBuffer(1,c.sampleRate*.11,c.sampleRate),d=b.getChannelData(0);for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*(1-j/d.length);const s=c.createBufferSource(),g=c.createGain();s.buffer=b;g.gain.setValueAtTime(.0001,t+i*.055);g.gain.exponentialRampToValueAtTime(.12,t+i*.055+.01);g.gain.exponentialRampToValueAtTime(.0001,t+i*.055+.1);s.connect(g).connect(c.destination);s.start(t+i*.055)} }catch(e){}}
function confetti(n){const c=document.getElementById("confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;let p=Array.from({length:n},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*12-3,s:Math.random()*8+4,r:Math.random()*6})),st=performance.now();function f(t){x.clearRect(0,0,c.width,c.height);p.forEach(a=>{a.x+=a.vx;a.vy+=.45;a.y+=a.vy;a.r+=.2;x.save();x.translate(a.x,a.y);x.rotate(a.r);x.fillStyle=["#f15a3c","#ffbd3f","#2fa7a5","#58a56b","#4ba2d0","#d84b79"][Math.floor(Math.random()*6)];x.fillRect(-a.s/2,-a.s/2,a.s,a.s*1.6);x.restore()});if(t-st<1300)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)}requestAnimationFrame(f)}
home();
</script></body></html>
