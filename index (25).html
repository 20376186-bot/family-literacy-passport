yPanel" onclick="const panel=document.getElementById('listenStoryPanel');const open=panel.hidden;panel.hidden=!open;this.setAttribute('aria-expanded',String(open));">🎧 Listen to the Story ▾</button><button type="button" class="tool asl-story-button" aria-expanded="false" aria-controls="aslStoryChoices" onclick="const panel=document.getElementById('aslStoryChoices');const open=panel.hidden;panel.hidden=!open;this.setAttribute('aria-expanded',String(open));">🤟 Watch the Story in ASL ▾</button></div><div id="listenStoryPanel" class="listen-story-panel" hidden><strong>The Three Little Pigs — Read Aloud</strong><p>Listen to the full story. Use the audio controls to play, pause, or replay.</p><audio controls preload="none" style="width:100%;max-width:640px;margin-top:10px" aria-label="The Three Little Pigs full story read aloud"><source src="Slide%203%20The%20Three%20Little%20Pigs%20Read%20aloud.mp3" type="audio/mpeg">Your browser does not support audio playback. <a href="Slide%203%20The%20Three%20Little%20Pigs%20Read%20aloud.mp3">Open the audio file</a>.</audio></div><div id="aslStoryChoices" class="asl-story-choices" hidden><strong>Choose a signed story video</strong><p>Each video opens on YouTube in a new tab. Return here to continue your passport.</p><div class="asl-story-links"><a href="https://www.youtube.com/watch?v=J9HZ1JdV1Us" target="_blank" rel="noopener noreferrer" aria-label="Watch ASL story video 1 on YouTube, opens in a new tab">▶ Watch Video 1 ↗</a><a href="https://www.youtube.com/watch?v=3KWwF6dVYPY" target="_blank" rel="noopener noreferrer" aria-label="Watch ASL story video 2 on YouTube, opens in a new tab">▶ Watch Video 2 ↗</a></div></div><div class="supportnote">You never have to pick a support level. Use what helps you access the information and participate.</div></div><div class="stage-wrap">${!state.started?startStory():pathChooser()}</div>${state.started&&state.path?`<div class="experience-layout"><div><div id="stageWrap" class="stage-wrap">${stageMarkup()}</div></div>${experienceProgress()}</div>`:''}</div></section>`;
applySupportClass();
if(window.flpRefreshContrast)window.flpRefreshContrast();
}
function startStory(){return `<div class="story-card"><div class="chapter">LET’S BEGIN</div><h2>First, meet the story.</h2><p>Three pigs set out to build homes of their own.</p><div class="story-text"><p><strong>The Three Little Pigs</strong></p><p>The three pigs decided it was time to build homes of their own. Each pig chose a different way to build a house.</p></div><div class="story-tools"><button class="tool" onclick="speak('The three pigs decided it was time to build homes of their own. Each pig chose a different way to build a house.')">🔊 Hear this</button><button class="tool" onclick="toggleSupport()">👀 Show me</button><button class="tool" onclick="speak('The three pigs decided it was time to build homes of their own. Each pig chose a different way to build a house.')">🔁 Again</button></div><div class="next"><button class="primary" onclick="beginStory()">Continue →</button></div></div>`}
function pathChooser(){return `<div class="story-card"><div class="chapter">NOW CHOOSE WHAT YOU WANT TO EXPLORE</div><h2>What would you like to explore?</h2><p>You have enough of the story to choose. There is no right path, and you can explore more later.</p><div class="pathgrid"><button type="button" class="pathcard" onclick="choosePath('experience')"><img src="${IMG["straw.jpg"]}" alt="A simple storybook house"><div class="pathcopy"><strong>🌺 Experience the Story</strong><small>Make choices, build, and see what happens.</small></div></button><button type="button" class="pathcard" onclick="choosePath('perspective')"><img src="${IMG["wolf-house.jpg"]}" alt="A wolf approaching a house"><div class="pathcopy"><strong>🐺 Hear Another Side</strong><small>Hear what the pigs and the wolf each say happened.</small></div></button><button type="button" class="pathcard" onclick="choosePath('investigate')"><img src="${IMG["investigator-path.png"]}" alt="A magnifying glass and story clues"><div class="pathcopy"><strong>🔎 Investigate the Story</strong><small>Compare information, look for evidence, and decide what you think.</small></div></button></div><p class="supportnote"><strong>Not sure?</strong> Start with Experience the Story. You can change your mind later.</p></div>`}
function beginStory(){if(!state.started){state.started=true;state.storyStep=0;save();renderExperience();setTimeout(()=>document.getElementById('stageWrap')?.focus?.({preventScroll:true}),0)}}
function experienceProgress(){const labels=state.path==='experience'?['Access the story','Build a house','Make a story choice','Family reflection']:state.path==='perspective'?['Access the story','Hear both perspectives','Compare perspectives','Wolf’s story + reflection']:['What do we know?','Find missing information','Investigate the feed','Make your case + reflect'];return `<aside class="journey-rail" aria-label="November journey"><div class="chapter">YOUR NOVEMBER JOURNEY</div><div class="rail-count">${state.tasks.filter(Boolean).length} of 4 complete</div>${labels.map((label,i)=>`<div class="rail-item ${state.tasks[i]?'done':''}"><span class="rail-dot">${state.tasks[i]?'✓':''}</span><span>${label}</span></div>`).join('')}</aside>`}

function stageMarkup(){if(state.path==='experience')return `<div id="stage1" class="stage ${state.storyStep===0?'active':''}">${experienceStory1()}</div><div id="stage2" class="stage ${state.storyStep===1?'active':''}">${experienceStory2()}</div><div id="stage3" class="stage ${state.storyStep===2?'active':''}">${experienceStory3()}</div><div id="stage4" class="stage ${state.storyStep===3?'active':''}">${reflectionStage()}</div>`;if(state.path==='perspective')return `<div id="stage1" class="stage ${state.storyStep===0?'active':''}">${perspective1()}</div><div id="stage2" class="stage ${state.storyStep===1?'active':''}">${perspective2()}</div><div id="stage3" class="stage ${state.storyStep===2?'active':''}">${perspective3()}</div><div id="stage4" class="stage ${state.storyStep===3?'active':''}">${perspective4()}</div>`;return `<div id="stage1" class="stage ${state.storyStep===0?'active':''}">${investigate1()}</div><div id="stage2" class="stage ${state.storyStep===1?'active':''}">${investigate2()}</div><div id="stage3" class="stage ${state.storyStep===2?'active':''}">${investigate3()}</div><div id="stage4" class="stage ${state.storyStep===3?'active':''}">${investigate4()}</div>`}
function accessLine(text){return `<div class="story-tools"><button class="tool" onclick="speak(${escapeHtml(JSON.stringify(text))})">🔊 Hear it</button><button class="tool" onclick="showAccessSupport(${escapeHtml(JSON.stringify(text))})">👀 Show me</button><button class="tool" onclick="speak(${escapeHtml(JSON.stringify(text))})">🔁 Again</button></div><div id="accessVisual" class="access-visual" aria-live="polite"></div>`}
function svgStraw(){return `<svg class="material-illustration" viewBox="0 0 120 80" aria-hidden="true"><path d="M25 64L49 15M38 68L60 12M53 67L73 17M68 67L87 24" stroke="#c7a64a" stroke-width="8" stroke-linecap="round"/><path d="M21 62Q56 75 91 61" fill="none" stroke="#8f7137" stroke-width="4"/></svg>`}
function svgSticks(){return `<svg class="material-illustration" viewBox="0 0 120 80" aria-hidden="true"><path d="M20 64L91 18M29 70L101 31M17 43L80 62M35 18L92 67" stroke="#8b6244" stroke-width="9" stroke-linecap="round"/><circle cx="20" cy="64" r="5" fill="#6e4b34"/><circle cx="91" cy="18" r="5" fill="#6e4b34"/></svg>`}
function svgBricks(){return `<svg class="material-illustration" viewBox="0 0 120 80" aria-hidden="true"><g fill="#b75b45" stroke="#7e4437" stroke-width="2"><rect x="12" y="48" width="44" height="16" rx="2"/><rect x="59" y="48" width="48" height="16" rx="2"/><rect x="25" y="29" width="42" height="16" rx="2"/><rect x="70" y="29" width="36" height="16" rx="2"/><rect x="47" y="10" width="40" height="16" rx="2"/></g></svg>`}
function svgHouse(material=''){const wall=material==='bricks'?'#b75b45':material==='sticks'?'#8b6244':material==='straw'?'#d8bd62':'#d6c7a6';return `<svg class="house-svg" viewBox="0 0 330 220" role="img" aria-label="House built with ${material||'the selected material'}"><path d="M65 95L165 35L265 95V195H65Z" fill="${wall}" stroke="#5e4b3c" stroke-width="6"/><path d="M48 98L165 22L282 98" fill="none" stroke="#6d5338" stroke-width="13" stroke-linejoin="round"/>${material==='bricks'?'<g stroke="#7e4437" stroke-width="3" opacity=".75"><path d="M65 125H265M65 157H265M115 95V125M215 95V125M90 125V157M175 125V157M245 157V195M125 157V195"/></g>':material==='sticks'?'<g stroke="#5e402c" stroke-width="6" opacity=".9"><path d="M65 130L265 75M70 160L265 105M75 190L265 135M95 95L250 190M65 105L230 195"/></g>':material==='straw'?'<g stroke="#a88739" stroke-width="6" opacity=".9"><path d="M75 120L255 90M70 150L260 120M75 180L255 150M100 100L250 180M70 105L230 190"/></g>':''}<rect x="139" y="143" width="52" height="52" rx="4" fill="#6d5338"/><rect x="82" y="118" width="38" height="38" rx="3" fill="#b9d9e8" stroke="#5e4b3c" stroke-width="4"/><rect x="210" y="118" width="38" height="38" rx="3" fill="#b9d9e8" stroke="#5e4b3c" stroke-width="4"/></svg>`}
function experienceStory1(){return `<div class="story-card"><div class="chapter">EXPERIENCE THE STORY · ACTIVITY 1</div><h2>Same story. Different ways.</h2><p>The three pigs decided to build homes of their own. Choose the tools that help you access the same information.</p><div class="access-choice-row"><button class="tool" onclick="showStoryMode('hear')">🔊 Hear it</button><button class="tool" onclick="showStoryMode('see')">👀 Show me</button><button class="tool" onclick="showStoryMode('read')">📖 Read it</button><button class="tool" onclick="showStoryMode('simple')">🧩 Simpler</button><button class="tool" onclick="showStoryMode('together')">🤝 Together</button></div><div id="storyMode" class="mode-panel"><strong>Choose a way to access the story.</strong><p>You can switch ways at any time.</p></div><div class="material-story-grid"><div class="material-story-card"><img src="${IMG["straw.jpg"]}" alt="A pig beside a straw house"><div><strong>The first pig built a house from straw.</strong><span>STRAW · Dried plants used to build.</span></div></div><div class="material-story-card"><img src="${IMG["sticks.jpg"]}" alt="A pig beside a house made from sticks"><div><strong>The second pig built a house from sticks.</strong><span>STICKS · Pieces of wood used to build.</span></div></div><div class="material-story-card"><img src="${IMG["bricks.jpg"]}" alt="A pig beside a brick house"><div><strong>The third pig built a house from bricks.</strong><span>BRICKS · Hard blocks used to build.</span></div></div></div><div class="branch"><strong>What helped you understand?</strong></div><div class="choices"><button class="choice" onclick="selectChoice(this,'Hearing can help you access information.')">🔊 Hearing it</button><button class="choice" onclick="selectChoice(this,'Seeing can help you access information.')">👀 Seeing it</button><button class="choice" onclick="selectChoice(this,'Reading can help you access information.')">📖 Reading it</button><button class="choice" onclick="selectChoice(this,'Shorter language can help you access information.')">🧩 Simpler words</button><button class="choice" onclick="selectChoice(this,'Working with someone can help you access information.')">🤝 Someone helping</button><button class="choice" onclick="selectChoice(this,'More than one way can help you access information.')">✨ More than one way</button></div><div id="stageFeedback" class="feedback hidden"></div><div class="next"><button id="activity1Done" class="primary" onclick="completeActivity(0,1)" disabled>Continue to Activity 2 →</button></div><div class="local-celebration"><span class="local-confetti"><i></i><i></i><i></i><i></i></span>Activity complete — you found a way to access the story.</div></div>`} 
function showStoryMode(mode){const panel=document.getElementById('storyMode');if(!panel)return;const data={read:`<strong>📖 READ IT</strong><p>The three pigs decided to build homes of their own. The first pig built a house from straw. The second pig built a house from sticks. The third pig built a house from bricks.</p>`,hear:`<strong>🔊 HEAR IT</strong><p>The same information is read aloud. You can listen while looking at the pictures.</p>`,see:`<strong>👀 SHOW ME</strong><div class="showme-grid"><div><img src="${IMG["straw.jpg"]}" alt="Pig beside straw house"><strong>STRAW</strong><span>Dried plants used to build.</span></div><div><img src="${IMG["sticks.jpg"]}" alt="Pig beside stick house"><strong>STICKS</strong><span>Pieces of wood used to build.</span></div><div><img src="${IMG["bricks.jpg"]}" alt="Pig beside brick house"><strong>BRICKS</strong><span>Hard blocks used to build.</span></div></div><p><strong>Same story. Different ways to access it.</strong></p>`,simple:`<strong>🧩 SIMPLER</strong><p>Three pigs build houses.</p><p>One uses straw. One uses sticks. One uses bricks.</p>`,together:`<strong>🤝 TOGETHER</strong><p>A family member, teacher, or communication partner can read, point to the pictures, explain the words, model a response, or talk about the story with you.</p>`};panel.innerHTML=data[mode];if(mode==='hear')speak('The three pigs decided to build homes of their own. The first pig built a house from straw. The second pig built a house from sticks. The third pig built a house from bricks.')} 
function showStageRead(){const p=document.getElementById('stageVisual');if(!p)return;p.innerHTML='<h4>📖 READ IT</h4><div class="mode-panel"><strong>The wolf comes to the house.</strong><p>“Little pig, little pig, let me come in!”</p></div>';p.classList.remove('hidden')} 
function experienceStory2(){return `<div class="story-card"><div class="chapter">EXPERIENCE THE STORY · ACTIVITY 2</div><h2>Build a house.</h2><p>Learn what each material is. Choose one. Then choose a reason and build your house.</p><div class="house"><strong>CHOOSE A MATERIAL</strong><div class="material-cards visual-material-cards"><button class="material-card ${state.houseMaterial==='straw'?'selected':''}" onclick="previewMaterial('straw')"><img src="${IMG["straw.jpg"]}" alt="Straw house material"><b>Straw</b><small>Dried plants</small></button><button class="material-card ${state.houseMaterial==='sticks'?'selected':''}" onclick="previewMaterial('sticks')"><img src="${IMG["sticks.jpg"]}" alt="Sticks used as a building material"><b>Sticks</b><small>Pieces of wood</small></button><button class="material-card ${state.houseMaterial==='bricks'?'selected':''}" onclick="previewMaterial('bricks')"><img src="${IMG["bricks.jpg"]}" alt="Bricks used as a building material"><b>Bricks</b><small>Hard blocks</small></button></div><div id="materialPreview" class="mode-panel">${materialPreview(state.houseMaterial||'')||'<strong>Choose a material to learn more.</strong><p>You will see a picture and words before you decide.</p>'}</div><div class="house-scene"><div class="sun"></div><div class="hill"></div>${svgHouse(state.houseMaterial||'')}</div></div><div class="branch"><strong>Why did you choose it?</strong></div><div class="reason-grid"><button class="choice" onclick="houseReason('fast')">⏱️ It may take less time.</button><button class="choice" onclick="houseReason('strong')">💪 It may be stronger.</button><button class="choice" onclick="houseReason('choice')">❤️ I like this choice.</button><button class="choice" onclick="houseReason('other')">💬 I have another reason.</button></div><div id="houseFeedback" class="feedback ${state.houseReason?'':'hidden'}">${state.houseReasonText||''}</div><div class="final-action"><p><strong>Ready?</strong> Choose 1 material and 1 reason. Then build your house.</p><button id="buildHouseBtn" class="primary" onclick="buildHouse()">Build My House</button></div><div class="local-celebration"><span class="local-confetti"><i></i><i></i><i></i><i></i></span>Activity complete — your house is built.</div>${state.houseBuilt?'<div class="built-message"><strong>Your house is built!</strong><p>You made a choice and followed it through.</p><div class="activity-complete">✓ Activity complete</div></div>':''}</div>`} 
function materialPreview(m){if(!m)return '';const d={straw:['STRAW','Straw is dried plants. It is light and can be bundled together.'],sticks:['STICKS','Sticks are pieces of wood. They are pieces of wood that can be used to build.'],bricks:['BRICKS','Bricks are hard blocks used to build walls. They are heavy and strong.']}[m];return `<div class="material-detail"><div>${m==='straw'?svgStraw():m==='sticks'?svgSticks():svgBricks()}</div><div><strong>${d[0]}</strong><p>${d[1]}</p></div></div>`}
function previewMaterial(m){state.houseMaterial=m;state.houseBuilt=false;save();const p=document.getElementById('materialPreview');if(p)p.innerHTML=materialPreview(m);const scene=document.querySelector('#stageWrap .stage.active .house-scene');if(scene)scene.innerHTML='<div class="sun"></div><div class="hill"></div>'+svgHouse(m);document.querySelectorAll('.material-card').forEach(b=>b.classList.remove('selected'));const chosen=[...document.querySelectorAll('.material-card')].find(b=>b.querySelector('b')?.textContent.toLowerCase()===m);if(chosen)chosen.classList.add('selected');updateBuildButton();}
function houseReason(type){const msgs={fast:'You chose a reason about time.',strong:'You chose a reason about strength.',choice:'You chose because you liked it.',other:'Your reason matters too. Different people can make different choices.'};state.houseReason=type;state.houseReasonText=msgs[type];save();document.querySelectorAll('.reason-grid .choice').forEach(b=>b.classList.remove('selected'));const labels={fast:'It may take less time.',strong:'It may be stronger.',choice:'I like this choice.',other:'I have another reason.'};const chosen=[...document.querySelectorAll('.reason-grid .choice')].find(b=>b.textContent.trim()===labels[type]);if(chosen)chosen.classList.add('selected');const f=document.getElementById('houseFeedback');if(f){f.textContent=msgs[type];f.classList.remove('hidden')}updateBuildButton();}
function updateBuildButton(){const b=document.getElementById('buildHouseBtn');if(!b)return;const ready=!!(state.houseMaterial&&state.houseReason);b.disabled=!ready;b.setAttribute('aria-disabled',String(!ready));if(ready){b.textContent='Build My House';b.classList.add('ready-build')}else{b.textContent='Choose a material and reason';b.classList.remove('ready-build')}}
function buildHouse(){if(!state.houseMaterial||!state.houseReason){const f=document.getElementById('houseFeedback');if(f){f.textContent='Choose a material and a reason first. Then you can build your house.';f.classList.remove('hidden')}return;}state.houseBuilt=true;save();const c=document.querySelector('.local-celebration');if(c)c.classList.add('show');completeTask(1);setTimeout(()=>{state.storyStep=2;save();renderExperience();},550);setTimeout(()=>document.querySelector('#stageWrap .stage.active')?.focus?.({preventScroll:true}),0)}
function showAccessSupport(text){const panel=document.getElementById('accessVisual');if(!panel)return;let html='';const t=String(text).toLowerCase();if(t.includes('straw')||t.includes('sticks')||t.includes('bricks')){html=`<div class="access-visual-grid"><div><div class="access-art">${svgStraw()}</div><strong>Straw</strong><span>Dried plants</span></div><div><div class="access-art">${svgSticks()}</div><strong>Sticks</strong><span>Pieces of wood</span></div><div><div class="access-art">${svgBricks()}</div><strong>Bricks</strong><span>Hard blocks used to build</span></div></div><p><strong>Same information:</strong> three pigs, three houses, three materials.</p>`;}else if(t.includes('wolf')){html=`<div class="access-photo"><img src="${IMG["wolf-house.jpg"]}" alt="Illustration of the wolf in a lush island setting"><div><strong>The wolf arrives at the house.</strong><span>Look at the picture while you listen or read.</span></div></div>`;}else{html=`<div class="access-photo"><img src="${IMG["straw.jpg"]}" alt="Illustration of the pigs and a house in a lush island setting"><div><strong>Look at the picture while you read or listen.</strong><span>The image gives you another way to connect with the information.</span></div></div>`;}panel.innerHTML=html;panel.classList.add('show');} 

function experienceStory3(){return `<div class="story-card activity3-card"><div class="chapter">EXPERIENCE THE STORY · ACTIVITY 3</div><h2>The wolf arrives.</h2><div class="activity3-hero-image"><img src="${IMG["wolf-house.jpg"]}" alt="A wolf approaching a house"><div><strong>Wolf + house</strong><span>The wolf comes to the house.</span></div></div><div class="story-text"><p><strong>The wolf comes to the house.</strong></p><p>“Little pig, little pig, let me come in!”</p></div><div class="story-tools"><button class="tool" onclick="speak('The wolf comes to the house. Little pig, little pig, let me come in!')">🔊 Hear it</button><button class="tool" onclick="showStageVisual('wolf')">👀 Show me</button><button class="tool" onclick="showStageRead()">📖 Read it</button></div><div id="stageVisual" class="access-visual-panel hidden"></div><div class="branch"><strong>What could the pig do?</strong></div><div class="visual-choice-grid"><button type="button" class="visual-choice" onclick="chooseStory3(0,this,'Opening the door is one possible choice.')"><img src="${IMG["open-door.jpg"]}" alt="Pig opening a door"><strong>Open the door</strong><span>Let the wolf come in.</span></button><button type="button" class="visual-choice" onclick="chooseStory3(0,this,'Saying no is one possible choice.')"><img src="${IMG["say-no.jpg"]}" alt="Pig saying no"><strong>Say no</strong><span>Keep the door closed.</span></button><button type="button" class="visual-choice" onclick="chooseStory3(0,this,'Getting help is one possible choice.')"><img src="${IMG["get-help.jpg"]}" alt="Three pigs together"><strong>Get help</strong><span>Call the other pigs.</span></button><button type="button" class="visual-choice" onclick="chooseStory3(0,this,'Asking why is one possible choice.')"><img src="${IMG["ask-why.jpg"]}" alt="Pig thinking about a question"><strong>Ask why</strong><span>Find out what he wants.</span></button></div><div id="choice1Feedback" class="feedback hidden"></div><div class="branch"><strong>The wolf blows on the house.</strong><span>What do you think might happen?</span></div><div class="activity3-blow-image"><img src="${IMG["wolf-blows-house.jpg"]}" alt="The wolf blowing toward the house"><strong>Wolf + house</strong><span>Look at the picture while you think.</span></div><div class="visual-choice-grid prediction-grid"><button type="button" class="visual-choice" onclick="chooseStory3(1,this,'The house might stay.')"><img src="${IMG["house-stays.jpg"]}" alt="A house still standing"><strong>It might stay.</strong></button><button type="button" class="visual-choice" onclick="chooseStory3(1,this,'The house might fall.')"><img src="${IMG["house-falls.jpg"]}" alt="A house that has fallen"><strong>It might fall.</strong></button><button type="button" class="visual-choice no-image" onclick="chooseStory3(1,this,'It is okay not to know yet.')"><div class="question-visual">?</div><strong>I’m not sure.</strong><span>It is okay to keep thinking.</span></button></div><div id="choice2Feedback" class="feedback hidden"></div><div class="next"><button id="activity3Done" class="primary" onclick="completeActivity(2,3)" disabled>Continue to reflection →</button></div><div id="activity3Celebrate" class="local-celebration"><span class="local-confetti"><i></i><i></i><i></i><i></i></span>Activity complete — you made choices and predicted what might happen.</div></div>`} 
function socialPost(kind){
 const pig=kind==='pigs';
 const image=pig?IMG["social-pigs.png"]:IMG["social-wolf.png"];
 const name=pig?'Three Little Pigs':'The Big Bad Wolf';
 const time=pig?'2 hours ago':'3 hours ago';
 const alt=pig?'Three pigs beside a simple house':'A wolf near a simple house';
 const avatar=pig?IMG["straw.jpg"]:IMG["wolf-house.jpg"];
 const caption=pig
   ?`We worked hard to build our homes. Then the wolf came to our door. We wanted to stay safe.`
   :`I went to the pigs' houses because I wanted to borrow a cup of sugar for a cake for my grandmother.`;
 const short=pig?'The wolf came. The pigs wanted to stay safe.':'I wanted to borrow a cup of sugar for a cake for my grandmother.';
 return `<article class="social-post ${pig?'pig-post':'wolf-post'}" aria-label="A fictional social media post from ${name}">
   <div class="social-head"><img src="${avatar}" alt="${alt}"><div><strong>${name}</strong><span>${time} · fictional story post</span></div><b>•••</b></div>
   <img class="social-main-image" src="${image}" alt="${alt}">
   <div class="social-reactions"><span>♡</span><span>◯</span><span>⌁</span><span>♡</span></div>
   <div class="social-caption"><strong>${name}</strong> ${caption}</div>

ear more from both sides.</span></button><button class="visual-choice" onclick="selectChoice(this,'You are not ready to decide yet.')"><div class="choice-symbol">🔎</div><strong>I need more information.</strong><span>Not deciding yet is okay.</span></button></div><div class="feedback hidden"></div><div class="next"><button class="primary" onclick="completeActivity(2,3)">Continue to the wolf’s story →</button></div></div>`}

g><span>This is another part of his explanation.</span></button><button class="visual-choice" onclick="selectChoice(this,'I need more information before I decide.')"><div class="choice-symbol">🔎</div><strong>I need more information.</strong><span>It is okay not to decide yet.</span></button></div><div class="feedback hidden"></div><div class="reflection" style="margin-top:24px"><h2>Finish your literacy adventure</h2><p>You've completed the learning activities! Earn your stamp now. Sharing feedback is optional and never required.</p><div class="save-reflection"><button class="primary" onclick="saveReflectionAndFinish()">Earn My Passport Stamp →</button></div><div id="stampEarned" class="stamp-earned ${state.complete?'show':''}"><div class="stamp"><div><small>NOVEMBER</small><strong>LITERACY<br>IS ACCESS</strong><small>2026 ✓</small></div></div><p><strong>🎊 Stamp earned!</strong> Your November experience is complete.</p></div><div class="passport-feedback-inline" style="margin-top:22px;padding:16px;border:1px solid #cbdad8;border-radius:16px;background:#f7fbfa"><h3>Optional family feedback</h3><p>Would you like to tell us about your experience? This is voluntary and does not affect your stamp. Please do not include names or identifying information.</p><button type="button" class="secondary" onclick="toggleInlineFeedback(this)" aria-expanded="false">Share optional feedback</button><div hidden style="margin-top:14px"><iframe title="Optional Family Literacy Passport reflection form" loading="lazy" data-form-src="https://docs.google.com/forms/d/e/1FAIpQLScOm03zUsqR6UzrNeZEBQt7c1PRw37TsEKhWv000oRSvTFOCw/viewform?embedded=true" style="width:100%;height:1650px;border:0" referrerpolicy="strict-origin-when-cross-origin"></iframe><p style="font-size:14px">If the form does not appear, <a href="https://docs.google.com/forms/d/e/1FAIpQLScOm03zUsqR6UzrNeZEBQt7c1PRw37TsEKhWv000oRSvTFOCw/viewform" target="_blank" rel="noopener noreferrer">open the form in a new tab</a>.</p></div></div></div></div></div>`}

function showInvestigationSupport(id,text,img,alt){const p=document.getElementById(id+'Show');if(!p)return;p.className='showme-investigate showme-investigate-expanded';const supports={

 inv4:`<div class="showme-steps"><h4>👀 SHOW ME · MAKE YOUR CASE</h4><p>Use a clue to explain your thinking. It is okay to say you need more information.</p><div class="showme-step-grid"><div class="showme-step"><img src="${IMG['investigate1.jpg']}" alt="Full information board showing the wolf and pig at a door"><strong>1. Look at the information</strong><span>Notice what each character says.</span></div><div class="showme-step"><img src="${IMG['wolf-sugar-scene.jpg']}" alt="Wolf holding a cake and a bowl of sugar"><strong>2. Name your clue</strong><span>Explain which picture or statement helped you decide.</span></div></div><p><strong>Finish the thought:</strong> “I think… because…” or “I need more information about…”</p></div>`
 };p.innerHTML=supports[id]||`<div class="showme-steps"><h4>👀 SHOW ME</h4><img src="${IMG[img]}" alt="${escapeHtml(alt)}"><p>${escapeHtml(text)}</p></div>`;}

function investigate1(){const text='The pigs say the wolf came to their houses. The wolf says he came to ask for a cup of sugar for a cake for his grandmother. Different people can tell the same event in different ways.';return `<div class="story-card"><div class="chapter">INVESTIGATE THE STORY · ACTIVITY 1</div><h2>What do we know?</h2><p>Start with the information. You can use the same story in different ways.</p><div class="investigate-hero"><img src="${IMG["investigate1.jpg"]}" alt="Wolf and pig at a door with fact, claim, and opinion clues"></div>${investigateAccess(text,'inv1','investigate1.jpg','Wolf and pig at a door with information clues')}<div class="concept-grid"><div class="concept-card"><span class="concept-icon">🔎</span><b>FACT</b><span>Something we can check.</span></div><div class="concept-card"><span class="concept-icon">💬</span><b>CLAIM</b><span>Something someone says is true.</span></div><div class="concept-card"><span class="concept-icon">❤️</span><b>OPINION</b><span>What someone thinks or feels.</span></div></div><div class="branch"><strong>Which idea best describes the information you just heard?</strong><span>There is no penalty for thinking it through.</span></div><div class="investigate-choices"><button class="investigate-choice" onclick="selectInvestigationChoice(0,'A fact is something we can check.',this)"><span class="big-icon">🔎</span><b>Fact</b><span>Something we can check.</span></button><button class="investigate-choice" onclick="selectInvestigationChoice(0,'A claim is something someone says is true.',this)"><span class="big-icon">💬</span><b>Claim</b><span>Something someone says is true.</span></button><button class="investigate-choice" onclick="selectInvestigationChoice(0,'An opinion is what someone thinks or feels.',this)"><span class="big-icon">❤️</span><b>Opinion</b><span>What someone thinks or feels.</span></button></div><div id="investigateFeedback0" class="feedback hidden"></div><div class="next"><button id="investigateDone0" class="primary" onclick="completeActivity(0,1)" disabled>Learn more →</button></div></div>`}
function investigate2(){const text='A fact is information we can check. A claim is something someone says is true. An opinion is what someone thinks or feels. We can ask questions when we need more information.';return `<div class="story-card"><div class="chapter">INVESTIGATE THE STORY · ACTIVITY 2</div><h2>Find the missing information.</h2><p>Good investigators notice what they know—and what they still need to know.</p><div class="investigate-hero"><img src="${IMG["investigate2.jpg"]}" alt="Evidence board showing what we know and what we do not know"></div>${investigateAccess(text,'inv2','investigate2.jpg','Evidence board showing known and missing information')}<div class="branch"><strong>What do we know?</strong></div><div class="investigate-choices"><button class="investigate-choice" onclick="selectInvestigationChoice(1,'We know the wolf came to the house.',this)"><span class="big-icon">🏠</span><b>The wolf came.</b><span>We have information about the event.</span></button><button class="investigate-choice" onclick="selectInvestigationChoice(1,'We know the pigs did not let the wolf in.',this)"><span class="big-icon">🚪</span><b>The pigs said no.</b><span>That is part of the story.</span></button><button class="investigate-choice" onclick="selectInvestigationChoice(1,'We do not know everything that happened next.',this)"><span class="big-icon">❓</span><b>We need more information.</b><span>Some details are still missing.</span></button></div><div id="investigateFeedback1" class="feedback hidden"></div><div class="investigate-note"><strong>Try asking:</strong> What did the wolf say? What was the pig thinking? What happened next?</div><div class="next"><button id="investigateDone1" class="primary" onclick="completeActivity(1,2)" disabled>Investigate the feed →</button></div></div>`}
function investigate3(){return `<div class="story-card"><div class="chapter">INVESTIGATE THE STORY · ACTIVITY 3</div><h2>Investigate the feed.</h2><p>Social posts can give us information—but we still need to look closely.</p>${investigateAccess('Look at the posts. The pigs say the wolf attacked their homes. The wolf says he wanted sugar. A neighbor says they saw the wolf at the house.','inv3','investigate3.jpg','Three fictional social media posts about the story')}<div class="investigate-posts"><article class="mini-post"><img src="${IMG["social-pigs.png"]}" alt="Fictional post from the Three Little Pigs"><div class="mini-body"><strong>🐷 Three Little Pigs</strong><p>“The wolf attacked our homes!”</p></div></article><article class="mini-post"><img src="${IMG["social-wolf.png"]}" alt="Fictional post from the Big Bad Wolf"><div class="mini-body"><strong>🐺 The Big Bad Wolf</strong><p>“I only wanted to ask for sugar.”</p></div></article><article class="mini-post"><img src="assets/image-ef83c875a928726a.webp" alt="A squirrel neighbor watching from a fence beside the pigs’ house"><div class="mini-body"><strong>🐿️ Squirrel neighbor</strong><p>“I saw the wolf at the pigs' house.”</p><div class="squirrel-reactions" aria-label="Social media reactions: 12 likes and 4 comments"><span aria-hidden="true">❤️</span> 12 likes <span aria-hidden="true">💬</span> 4 comments</div></div></article></div><div class="branch"><strong>What kind of information is this?</strong><span>Choose one post to examine.</span></div><div class="investigate-choices"><button class="investigate-choice" onclick="selectInvestigationChoice(2,'A post can contain a claim.',this)"><span class="big-icon">💬</span><b>Claim</b><span>Someone is saying something is true.</span></button><button class="investigate-choice" onclick="selectInvestigationChoice(2,'A post can share an opinion.',this)"><span class="big-icon">❤️</span><b>Opinion</b><span>Someone is sharing what they think or feel.</span></button><button class="inve function stopSpeech(){
 try{window.speechSynthesis?.cancel()}catch(e){}

}
function speak(t){
 const text=String(t||'').trim();if(!text)return;
 if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){
  speechStatus('Read-aloud is unavailable in this browser. Please use the written text.');return;
 }
 const synth=window.speechSynthesis;
 try{synth.cancel()}catch(e){}
 const utterance=new SpeechSynthesisUtterance(text);
 currentSpeech=utterance;utterance.lang='en-US';utterance.rate=.9;utterance.pitch=1;
 const voices=synth.getVoices();const voice=voices.find(v=>v.lang?.toLowerCase()==='en-us')||voices.find(v=>v.lang?.toLowerCase().startsWith('en'));
 if(voice)utterance.voice=voice;
 utterance.onstart=()=>{if(currentSpeech===utterance)speechStatus('🔊 Reading aloud… Use Stop Audio to stop.');};
 utterance.onend=()=>{if(currentSpeech===utterance){currentSpeech=null;speechStatus('Read-aloud finished.')}};
 utterance.onerror=(event)=>{if(currentSpeech===utterance){currentSpeech=null;speechStatus('Read-aloud could not play ('+(event.error||'audio error')+'). Check device volume and browser speech settings.')}};
 try{ synth.speak(utterance); if(synth.paused)synth.resume();speechStatus('Preparing read-aloud…'); }
 catch(e){currentSpeech=null;speechStatus('Read-aloud could not start. Please use the written text.');}
}

.flp-contrast-gallery h3{margin:0 0 8px}.flp-contrast-gallery p{line-height:1.5}
.flp-video-wrap{position:relative;width:100%;max-width:760px;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;margin:12px 0}
.flp-video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.flp-video-link{display:inline-block;font-weight:800;color:#075a89;margin-top:5px}
.passport-reward .flp-grand-celebration{margin:18px auto;padding:20px;max-width:650px;background:#fff8e4;border:2px solid #e9c86e;border-radius:20px;text-align:center}
.flp-grand-celebration strong{display:block;font-size:clamp(23px,4vw,34px);color:#0b3555}
.flp-grand-celebration p{font-size:18px;line-height:1.5}
.flp-grand-celebration button{margin-top:10px}
@media(prefers-reduced-motion:reduce){.local-confetti i{animation:none!important}}
</style>
<script id="flp-high-contrast-video-handler">
(function(){
 const video='https://www.youtube.com/embed/YVLLpajBdtI';
 window.flpRefreshContrast=function(){
   const page=document.getElementById('experiencePage');
   const toolbar=page?.querySelector('.access-tools');
   const accessPanel=page?.querySelector('.access-panel');
   if(!toolbar||!accessPanel)return;
   let button=toolbar.querySelector('#flpContrastToggle');
   if(!button){button=document.createElement('button');button.type='button';button.id='flpContrastToggle';button.className='tool flp-contrast-toggle';toolbar.appendChild(button)}
   button.textContent='◐ High-Contrast Story Video';
   button.setAttribute('aria-controls','flpContrastGallery');
   let panel=accessPanel.querySelector('#flpContrastGallery');
   if(!panel){panel=document.createElement('section');panel.id='flpContrastGallery';panel.className='flp-contrast-gallery';panel.setAttribute('aria-label','High-contrast story video');accessPanel.appendChild(panel)}
   // Load the iframe only on request; hiding removes it to stop playback.
   function setOpen(open){
     button.setAttribute('aria-expanded',String(open));
     panel.hidden=!open;
     panel.innerHTML=open?'<h3>The Three Little Pigs — High-Contrast Story Video</h3><p>Watch the story using high-contrast visuals. You can pause, replay, or open it on YouTube.</p><div class="flp-video-wrap"><iframe src="'+video+'" title="The Three Little Pigs — high-contrast story video" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div><a class="flp-video-link" href="https://www.youtube.com/watch?v=YVLLpajBdtI" target="_blank" rel="noopener noreferrer">Open high-contrast video on YouTube ↗</a>':'';
   }
   setOpen(false);
   button.onclick=()=>setOpen(panel.hidden);
 };
 document.addEventListener('DOMContentLoaded',window.flpRefreshContrast);
})();
</script>
</body>
</html>
