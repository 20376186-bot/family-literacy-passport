function experienceStory1(){return `<div class="story-card"><div class="chapter">EXPERIENCE THE STORY · ACTIVITY 1</div><h2>Same story. Different ways.</h2><p>The three pigs decided to build homes of their own. Choose the tools that help you access the same information.</p><div class="access-choice-row"><button class="tool" onclick="showStoryMode('hear')">🔊 Hear it</button><button class="tool" onclick="showStoryMode('see')">👀 Show me</button><button class="tool" onclick="showStoryMode('read')">📖 Read it</button><button class="tool" onclick="showStoryMode('simple')">🧩 Simpler</button><button class="tool" onclick="showStoryMode('together')">🤝 Together</button></div><div id="storyMode" class="mode-panel"><strong>Choose a way to access the story.</strong><p>You can switch ways at any time.</p></div><div class="material-story-grid"><div class="material-story-card"><img src="${IMG["straw.jpg"]}" alt="A pig beside a straw house"><div><strong>The first pig built a house from straw.</strong><span>STRAW · Dried plants used to build.</span></div></div><div class="material-story-card"><img src="${IMG["sticks.jpg"]}" alt="A pig beside a house made from sticks"><div><strong>The second pig built a house from sticks.</strong><span>STICKS · Pieces of wood used to build.</span></div></div><div class="material-story-card"><img src="${IMG["bricks.jpg"]}" alt="A pig beside a brick house"><div><strong>The third pig built a house from bricks.</strong><span>BRICKS · Hard blocks used to build.</span></div></div></div><div class="branch"><strong>What helped you understand?</strong></div><div class="choices"><button class="choice" onclick="selectChoice(this,'Hearing can help you access information.')">🔊 Hearing it</button><button class="choice" onclick="selectChoice(this,'Seeing can help you access information.')">👀 Seeing it</button><button class="choice" onclick="selectChoice(this,'Reading can help you access information.')">📖 Reading it</button><button class="choice" onclick="selectChoice(this,'Shorter language can help you access information.')">🧩 Simpler words</button><button class="choice" onclick="selectChoice(this,'Working with someone can help you access information.')">🤝 Someone helping</button><button class="choice" onclick="selectChoice(this,'More than one way can help you access information.')">✨ More than one way</button></div><div id="stageFeedback" class="feedback hidden"></div><div class="next"><button id="activity1Done" class="primary" onclick="completeActivity(0,1)" disabled>Continue to Activity 2 →</button></div><div class="local-celebration"><span class="local-confetti"><i></i><i></i><i></i><i></i></span>Activity complete — you found a way to access the story.</div></div>`} 
function showStoryMode(mode){const panel=document.getElementById('storyMode');if(!panel)return;const data={read:`<strong>📖 READ IT</strong><p>The three pigs decided to build homes of their own. The first pig built a house from straw. The second pig built a house from sticks. The third pig built a house from bricks.</p>`,hear:`<strong>🔊 HEAR IT</strong><p>The same information is read aloud. You can listen while looking at the pictures.</p>`,see:`<strong>👀 SHOW ME</strong><div class="showme-grid"><div><img src="${IMG["straw.jpg"]}" alt="Pig beside straw house"><strong>STRAW</strong><span>Dried plants used to build.</span></div><div><img src="${IMG["sticks.jpg"]}" alt="Pig beside stick house"><strong>STICKS</strong><span>Pieces of wood used to build.</span></div><div><img src="${IMG["bricks.jpg"]}" alt="Pig beside brick house"><strong>BRICKS</strong><span>Hard blocks used to build.</span></div></div><p><strong>Same story. Different ways to access it.</strong></p>`,simple:`<strong>🧩 SIMPLER</strong><p>Three pigs build houses.</p><p>One uses straw. One uses sticks. One uses bricks.</p>`,together:`<strong>🤝 TOGETHER</strong><p>A family member, teacher, or communication partner can read, point to the pictures, explain the words, model a response, or talk about the story with you.</p>`};panel.innerHTML=data[mode];if(mode==='hear')speak('The three pigs decided to build homes of their own. The first pig built a house from straw. The second pig built a house from sticks. The third pig built a house from bricks.')}

function experienceStory2(){return `<div class="story-card"><div class="chapter">EXPERIENCE THE STORY · ACTIVITY 2</div><h2>Build a house.</h2><p>Learn what each material is. Choose one. Then choose a reason and build your house.</p><div class="house"><strong>CHOOSE A MATERIAL</strong><div class="material-cards visual-material-cards"><button class="material-card ${state.houseMaterial==='straw'?'selected':''}" onclick="previewMaterial('straw')"><img src="${IMG["straw.jpg"]}" alt="Straw house material"><b>Straw</b><small>Dried plants</small></button><button class="material-card ${state.houseMaterial==='sticks'?'selected':''}" onclick="previewMaterial('sticks')"><img src="${IMG["sticks.jpg"]}" alt="Sticks used as a building material"><b>Sticks</b><small>Pieces of wood</small></button><button class="material-card ${state.houseMaterial==='bricks'?'selected':''}" onclick="previewMaterial('bricks')"><img src="${IMG["bricks.jpg"]}" alt="Bricks used as a building material"><b>Bricks</b><small>Hard blocks</small></button></div><div id="materialPreview" class="mode-panel">${materialPreview(state.houseMaterial||'')||'<strong>Choose a material to learn more.</strong><p>You will see a picture and words before you decide.</p>'}</div><div class="house-scene"><div class="sun"></div><div class="hill"></div>${svgHouse(state.houseMaterial||'')}</div></div><div class="branch"><strong>Why did you choose it?</strong></div><div class="reason-grid"><button class="choice" onclick="houseReason('fast')">⏱️ It may take less time.</button><button class="choice" onclick="houseReason('strong')">💪 It may be stronger.</button><button class="choice" onclick="houseReason('choice')">❤️ I like this choice.</button><button class="choice" onclick="houseReason('other')">💬 I have another reason.</button></div><div id="houseFeedback" class="feedback ${state.houseReason?'':'hidden'}">${state.houseReasonText||''}</div><div class="final-action"><p><strong>Ready?</strong> Choose 1 material and 1 reason. Then build your house.</p><button id="buildHouseBtn" class="primary" onclick="buildHouse()">Build My House</button></div><div class="local-celebration"><span class="local-confetti"><i></i><i></i><i></i><i></i></span>Activity complete — your house is built.</div>${state.houseBuilt?'<div class="built-message"><strong>Your house is built!</strong><p>You made a choice and followed it through.</p><div class="activity-complete">✓ Activity complete</div></div>':''}</div>`} 
function materialPreview(m){if(!m)return '';const d={straw:['STRAW','Straw is dried plants. It is light and can be bundled together.'],sticks:['STICKS','Sticks are pieces of wood. They are pieces of wood that can be used to build.'],bricks:['BRICKS','Bricks are hard blocks used to build walls. They are heavy and strong.']}[m];return `<div class="material-detail"><div>${m==='straw'?svgStraw():m==='sticks'?svgSticks():svgBricks()}</div><div><strong>${d[0]}</strong><p>${d[1]}</p></div></div>`}

e wolf blows on the house.</strong><span>What do you think might happen?</span></div><div class="activity3-blow-image"><img src="${IMG["wolf-blows-house.jpg"]}" alt="The wolf blowing toward the house"><strong>Wolf + house</strong><span>Look at the picture while you think.</span></div><div class="visual-choice-grid prediction-grid"><button type="button" class="visual-choice" onclick="chooseStory3(1,this,'The house might stay.')"><img src="${IMG["house-stays.jpg"]}" alt="A house still standing"><strong>It might stay.</strong></button><button type="button" class="visual-choice" onclick="chooseStory3(1,this,'The house might fall.')"><img src="${IMG["house-falls.jpg"]}" alt="A house that has fallen"><strong>It might fall.</strong></button><button type="button" class="visual-choice no-image" onclick="chooseStory3(1,this,'It is okay not to know yet.')"><div class="question-visual">?</div><strong>I’m not sure.</strong><span>It is okay to keep thinking.</span></button></div><div id="choice2Feedback" class="feedback hidden"></div><div class="next"><button id="activity3Done" class="primary" onclick="completeActivity(2,3)" disabled>Continue to reflection →</button></div><div id="activity3Celebrate" class="local-celebration"><span class="local-confetti"><i></i><i></i><i></i><i></i></span>Activity complete — you made choices and predicted what might happen.</div></div>`} 
function socialPost(kind){
 const pig=kind==='pigs';
 const image=pig?IMG["social-pigs.png"]:IMG["social-wolf.png"];
 const name=pig?'Three Little Pigs':'The Big Bad Wolf';
 const time=pig?'2 hours ago':'3 hours ago';
