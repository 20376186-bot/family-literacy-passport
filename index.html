.final-action{margin-top:22px;padding:18px;background:#f7f1e7;border-radius:18px;border:1px solid #d9cbb7}.final-action p{margin:0 0 12px;color:#506579}.ready-build{background:#58a56b!important;color:#fff!important}.local-celebration{display:none}.local-celebration.show{display:block;margin-top:15px;padding:12px 15px;background:#eef8ef;border:1px solid #9bc6a4;border-radius:14px;color:#367247;font-weight:850}

<body>
<header><div class="brand"><div class="spark">✦</div><span>Family Literacy Passport</span></div><nav><button class="navbtn active" id="homeNav" onclick="showHome()">Passport <span class="count" id="count">0/8</span></button><button class="navbtn" onclick="showStamps()">Stamps</button></nav></header>
<main>
<div id="homePage"></div>
<div id="experiencePage" class="experience-page"></div>
<div id="stampsPage" class="experience-page"></div>
</main>
<div id="completionModal" class="completion-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><div style="font-size:64px">🎊</div><h2 id="modalTitle">November complete!</h2><p>You earned your first passport stamp.</p><div class="stamp"><div><small>NOVEMBER</small><strong>LITERACY<br>IS ACCESS</strong><small>2026 ✓</small></div></div><strong>Progress: 1 / 8</strong><div class="finish-actions"><button class="primary" onclick="closeModalAndHome()">Return to Passport</button></div></div></div>
<canvas id="confetti"></canvas>
<script>
const stops=[
 ["November 18, 2026","Literacy Is Access","Same goal. Different paths.","#b66a3c"],
 ["December 16, 2026","Literacy in My World","Literacy is everywhere.","#2f9695"],
 ["January 20, 2027","Choose Your Literacy","Choice increases engagement.","#c99a32"],
 ["February 17, 2027","Read It. Do It.","Literacy helps us do things.","#5b9b72"],
 ["March 24, 2027","Everyone Has a Voice","Communication is access.","#d84b79"],
 ["April 21, 2027","Find What Works","Tools can increase access.","#4ba2d0"],
 ["May 19, 2027","Literacy for My Future","Literacy supports independence.","#c86f42"],
 ["June 16, 2027","Our Literacy Stories","Everyone has a literacy story.","#2f9695"]
];
const defaultState={complete:false,tasks:[false,false,false,false],houseBlocks:[],houseMaterial:"",houseReason:"",houseReasonText:"",houseBuilt:false,supported:false,storyStep:0,path:"",started:false,reflection:["","",""]};
let state={...defaultState,...JSON.parse(localStorage.getItem("flp")||"{}")};
state.tasks=state.tasks||[false,false,false,false];state.houseBlocks=state.houseBlocks||[];state.reflection=state.reflection||["","",""];state.houseReason=state.houseReason||"";state.houseReasonText=state.houseReasonText||"";state.started=!!state.started;
const save=()=>localStorage.setItem("flp",JSON.stringify(state));
const homeEl=document.getElementById("homePage"), expEl=document.getElementById("experiencePage"), stampsEl=document.getElementById("stampsPage"), countEl=document.getElementById("count");
function updateCount(){countEl.textContent=(state.complete?1:0)+"/8"}
function showHome(){expEl.classList.remove("active");stampsEl.classList.remove("active");homeEl.style.display="block";document.getElementById("homeNav").classList.add("active");renderHome();window.scrollTo(0,0)}
function renderHome(){updateCount();homeEl.innerHTML=`<section class="hero"><div class="hero-inner"><div><div class="eyebrow">HAWAIʻI · 2026–2027</div><h1>Family<br>Literacy<br>Passport</h1><div class="tagline">Explore • Experience • Grow</div><div class="subtag">A Year of Discovery Through Literacy</div></div><div class="progressbox"><div class="bigcount"><span>${state.complete?1:0}</span> / 8</div><div class="smallcaps">EXPERIENCES COMPLETE</div><div class="bar"><div style="width:${state.complete?12.5:0}%"></div></div><button class="primary" onclick="openExperience()">${state.complete?"Review November":"Start November"} →</button></div></div></section><div class="sectionhead"><div><h2>Your passport stops</h2><p>Same goal. Different paths.</p></div></div><section class="grid">${stops.map((s,i)=>`<article class="card"><div class="cardtop" style="background:${s[3]}"><span>STOP ${i+1}</span><span>${i+1}</span></div>${i===0?`<div class="cardart"><img src="assets/november-hero-art.jpg" alt="Three pigs exploring a lush island path"><div class="artlabel">A Story With Many Paths</div></div>`:`<div class="cardart"><strong style="font-size:18px;color:#526579">Coming soon</strong></div>`}<div class="cardbody"><div class="date">${s[0]}</div><h3>${s[1]}</h3><p class="quote" style="color:${s[3]}">“${s[2]}”</p>${i===0?`<button class="status ${state.complete?'done':'ready'}" onclick="openExperience()">${state.complete?'Completed ✓':'Explore November →'}</button>`:`<button class="status">Coming soon</button>`}</div></article>`).join("")}</section>`}
function openExperience(){homeEl.style.display="none";stampsEl.classList.remove("active");expEl.classList.add("active");document.getElementById("homeNav").classList.remove("active");renderExperience();window.scrollTo(0,0)}
function renderExperience(){
expEl.innerHTML=`<button class="back" onclick="showHome()">← Back to Passport</button><section class="experience-shell"><div class="expbar"><span>NOVEMBER 18, 2026</span><span>STOP 1 OF 8</span></div><div class="experience-content"><div class="experience-hero"><img src="assets/november-hero-art.jpg" alt="Three little pigs exploring a lush island landscape"><div class="hero-copy"><div class="eyebrow">NOVEMBER · STOP 1</div><h2>Literacy Is Access</h2><p>A Story With Many Paths</p></div></div><div class="intro"><h1>The Three Little Pigs</h1><p class="hook">“We all know the story… but do we?”</p><p class="intro-copy">The same story can be accessed in different ways. Choose the tools that help you. You can change them at any time.</p></div><div class="access-panel"><h3>YOUR ACCESS TOOLS</h3><p>Use any of these whenever they help. Everyone can use every tool.</p><div class="access-tools"><button class="tool" onclick="speakCurrent()">🔊 Hear</button><button class="tool" onclick="toggleSupport()" id="supportBtn">👀 Show me</button><button class="tool" onclick="toggleTextSize(-1)">A−</button><button class="tool" onclick="toggleTextSize(0)">A</button><button class="tool" onclick="toggleTextSize(1)">A+</button><button class="tool" onclick="speak('Explore together. A family member, teacher, or communication partner can read, model, point, or talk with you.')">🤝 Together</button><button class="tool" onclick="repeatDirection()">🔁 Again</button></div><div class="supportnote">You never have to pick a support level. Use what helps you access the information and participate.</div></div><div class="stage-wrap">${!state.started?startStory():pathChooser()}</div>${state.started&&state.path?`<div class="experience-layout"><div><div id="stageWrap" class="stage-wrap">${stageMarkup()}</div></div>${experienceProgress()}</div>`:''}</div></section>`;
applySupportClass();
}
function startStory(){return `<div class="story-card"><div class="chapter">LET’S BEGIN</div><h2>First, meet the story.</h2><p>Three pigs set out to build homes of their own.</p><div class="story-text"><p><strong>The Three Little Pigs</strong></p><p>The three pigs decided it was time to build homes of their own. Each pig chose a different way to build a house.</p></div><div class="story-tools"><button class="tool" onclick="speak('The three pigs decided it was time to build homes of their own. Each pig chose a different way to build a house.')">🔊 Hear this</button><button class="tool" onclick="toggleSupport()">👀 Show me</button><button class="tool" onclick="speak('The three pigs decided it was time to build homes of their own. Each pig chose a different way to build a house.')">🔁 Again</button></div><div class="next"><button class="primary" onclick="beginStory()">Continue →</button></div></div>`}
function pathChooser(){return `<div class="story-card"><div class="chapter">NOW CHOOSE WHAT YOU WANT TO EXPLORE</div><h2>What would you like to explore?</h2><p>You have enough of the story to choose. There is no right path, and you can explore more later.</p><div class="pathgrid"><button class="pathcard" onclick="choosePath('experience')"><img src="assets/november-pigs-path.jpg" alt="A simple house surrounded by tropical greenery"><div class="pathcopy"><strong>🌺 Experience the Story</strong><small>Make choices, build, and see what happens.</small></div></button><button class="pathcard" onclick="choosePath('perspective')"><img src="assets/november-wolf-path.jpg" alt="A wolf looking through lush tropical leaves"><div class="pathcopy"><strong>🐺 Hear Another Side</strong><small>Hear what the pigs and the wolf each say happened.</small></div></button><button class="pathcard" onclick="choosePath('investigate')"><img src="assets/november-investigator-path.jpg" alt="A magnifying glass and map on an island path"><div class="pathcopy"><strong>🔎 Investigate the Story</strong><small>Compare information, look for evidence, and decide what you think.</small></div></button></div><p class="supportnote"><strong>Not sure?</strong> Start with Experience the Story. You can change your mind later.</p></div>`}
function beginStory(){if(!state.started){state.started=true;state.storyStep=0;save();renderExperience();setTimeout(()=>document.getElementById('stageWrap')?.focus?.({preventScroll:true}),0)}}
function experienceProgress(){const labels=state.path==='experience'?['Access the story','Build a house','Make a story choice','Family reflection']:state.path==='perspective'?['Access the story','Hear both perspectives','Share your thinking','Family reflection']:['Access the story','Learn and examine','Use evidence and communicate','Family reflection'];return `<aside class="journey-rail" aria-label="November journey"><div class="chapter">YOUR NOVEMBER JOURNEY</div><div class="rail-count">${state.tasks.filter(Boolean).length} of 4 complete</div>${labels.map((label,i)=>`<div class="rail-item ${state.tasks[i]?'done':''}"><span class="rail-dot">${state.tasks[i]?'✓':''}</span><span>${label}</span></div>`).join('')}</aside>`}

function stageMarkup(){if(state.path==='experience')return `<div id="stage1" class="stage ${state.storyStep===0?'active':''}">${experienceStory1()}</div><div id="stage2" class="stage ${state.storyStep===1?'active':''}">${experienceStory2()}</div><div id="stage3" class="stage ${state.storyStep===2?'active':''}">${experienceStory3()}</div><div id="stage4" class="stage ${state.storyStep===3?'active':''}">${reflectionStage()}</div>`;if(state.path==='perspective')return `<div id="stage1" class="stage ${state.storyStep===0?'active':''}">${perspective1()}</div><div id="stage2" class="stage ${state.storyStep===1?'active':''}">${perspective2()}</div><div id="stage3" class="stage ${state.storyStep===2?'active':''}">${perspective3()}</div><div id="stage4" class="stage ${state.storyStep===3?'active':''}">${reflectionStage()}</div>`;return `<div id="stage1" class="stage ${state.storyStep===0?'active':''}">${investigate1()}</div><div id="stage2" class="stage ${state.storyStep===1?'active':''}">${investigate2()}</div><div id="stage3" class="stage ${state.storyStep===2?'active':''}">${investigate3()}</div><div id="stage4" class="stage ${state.storyStep===3?'active':''}">${reflectionStage()}</div>`}
function accessLine(text){return `<div class="story-tools"><button class="tool" onclick="speak(${JSON.stringify(text)})">🔊 Hear it</button><button class="tool" onclick="showAccessSupport(${JSON.stringify(text)})">👀 Show me</button><button class="tool" onclick="speak(${JSON.stringify(text)})">🔁 Again</button></div><div id="accessVisual" class="access-visual" aria-live="polite"></div>`}
function svgStraw(){return `<svg class="material-illustration" viewBox="0 0 120 80" aria-hidden="true"><path d="M25 64L49 15M38 68L60 12M53 67L73 17M68 67L87 24" stroke="#c7a64a" stroke-width="8" stroke-linecap="round"/><path d="M21 62Q56 75 91 61" fill="none" stroke="#8f7137" stroke-width="4"/></svg>`}
function svgSticks(){return `<svg class="material-illustration" viewBox="0 0 120 80" aria-hidden="true"><path d="M20 64L91 18M29 70L101 31M17 43L80 62M35 18L92 67" stroke="#8b6244" stroke-width="9" stroke-linecap="round"/><circle cx="20" cy="64" r="5" fill="#6e4b34"/><circle cx="91" cy="18" r="5" fill="#6e4b34"/></svg>`}
function svgBricks(){return `<svg class="material-illustration" viewBox="0 0 120 80" aria-hidden="true"><g fill="#b75b45" stroke="#7e4437" stroke-width="2"><rect x="12" y="48" width="44" height="16" rx="2"/><rect x="59" y="48" width="48" height="16" rx="2"/><rect x="25" y="29" width="42" height="16" rx="2"/><rect x="70" y="29" width="36" height="16" rx="2"/><rect x="47" y="10" width="40" height="16" rx="2"/></g></svg>`}
function svgHouse(material=''){const wall=material==='bricks'?'#b75b45':material==='sticks'?'#8b6244':material==='straw'?'#d8bd62':'#d6c7a6';return `<svg class="house-svg" viewBox="0 0 330 220" role="img" aria-label="House built with ${material||'the selected material'}"><path d="M65 95L165 35L265 95V195H65Z" fill="${wall}" stroke="#5e4b3c" stroke-width="6"/><path d="M48 98L165 22L282 98" fill="none" stroke="#6d5338" stroke-width="13" stroke-linejoin="round"/>${material==='bricks'?'<g stroke="#7e4437" stroke-width="3" opacity=".75"><path d="M65 125H265M65 157H265M115 95V125M215 95V125M90 125V157M175 125V157M245 157V195M125 157V195"/></g>':material==='sticks'?'<g stroke="#5e402c" stroke-width="6" opacity=".9"><path d="M65 130L265 75M70 160L265 105M75 190L265 135M95 95L250 190M65 105L230 195"/></g>':material==='straw'?'<g stroke="#a88739" stroke-width="6" opacity=".9"><path d="M75 120L255 90M70 150L260 120M75 180L255 150M100 100L250 180M70 105L230 190"/></g>':''}<rect x="139" y="143" width="52" height="52" rx="4" fill="#6d5338"/><rect x="82" y="118" width="38" height="38" rx="3" fill="#b9d9e8" stroke="#5e4b3c" stroke-width="4"/><rect x="210" y="118" width="38" height="38" rx="3" fill="#b9d9e8" stroke="#5e4b3c" stroke-width="4"/></svg>`}
function experienceStory1(){return `<div class="story-card"><div class="chapter">EXPERIENCE THE STORY · ACTIVITY 1</div><h2>Same information. Different ways to access it.</h2><p>Here is one part of the story. Try different ways to get the same information. You can switch whenever you want.</p><div class="story-text"><h3>The Three Little Pigs</h3><p>The three pigs decided to build homes of their own.</p><p>The first pig built a house from straw. The second pig built a house from sticks. The third pig built a house from bricks.</p></div><div class="access-choice-row"><button class="tool" onclick="showStoryMode('read')">Read it</button><button class="tool" onclick="showStoryMode('hear')">Hear it</button><button class="tool" onclick="showStoryMode('see')">See it</button><button class="tool" onclick="showStoryMode('simple')">Simpler</button><button class="tool" onclick="showStoryMode('together')">Together</button></div><div id="storyMode" class="mode-panel"><strong>Choose a way to access the story.</strong><p>The words will stay the same in meaning. The way you receive them can change.</p></div><div class="branch"><strong>What helped you understand?</strong></div><div class="choices"><button class="choice" onclick="selectChoice(this,'Hearing can help you access information.')">Hearing it</button><button class="choice" onclick="selectChoice(this,'Seeing can help you access information.')">Seeing it</button><button class="choice" onclick="selectChoice(this,'Reading can help you access information.')">Reading it</button><button class="choice" onclick="selectChoice(this,'Shorter language can help you access information.')">Simpler words</button><button class="choice" onclick="selectChoice(this,'Working with someone can help you access information.')">Someone helping</button><button class="choice" onclick="selectChoice(this,'More than one way can help you access information.')">More than one way</button></div><div id="stageFeedback" class="feedback hidden"></div><div class="next"><button id="activity1Done" class="primary" onclick="completeActivity(0,1)" disabled>Continue →</button></div><div class="local-celebration"><span class="local-confetti"><i></i><i></i><i></i><i></i></span>Activity complete — you found a way to access the story.</div></div>`}
function showStoryMode(mode){const panel=document.getElementById('storyMode');if(!panel)return;const data={read:`<strong>READ IT</strong><p>The three pigs decided to build homes of their own. The first pig built a house from straw. The second pig built a house from sticks. The third pig built a house from bricks.</p>`,hear:`<strong>HEAR IT</strong><p>The same information is being read aloud.</p>`,see:`<strong>SEE IT</strong><div class="story-visual"><div class="story-visual-card">${svgStraw()}<strong>Straw</strong><span>First pig → house</span></div><div class="story-visual-card">${svgSticks()}<strong>Sticks</strong><span>Second pig → house</span></div><div class="story-visual-card">${svgBricks()}<strong>Bricks</strong><span>Third pig → house</span></div></div><p>Three pigs. Three materials. Three houses.</p>`,simple:`<strong>SIMPLER</strong><p>Three pigs build houses.</p><p>One uses straw. One uses sticks. One uses bricks.</p>`,together:`<strong>TOGETHER</strong><p>A family member, teacher, or communication partner can read, point to the pictures, explain the words, model a response, or talk about the story with you.</p>`};panel.innerHTML=data[mode];if(mode==='hear')speak('The three pigs decided to build homes of their own. The first pig built a house from straw. The second pig built a house from sticks. The third pig built a house from bricks.')} 
function experienceStory2(){return `<div class="story-card"><div class="chapter">EXPERIENCE THE STORY · ACTIVITY 2</div><h2>Build a house.</h2><p>Learn about the materials. Choose one. Then build your house.</p><div class="house"><strong>THE MATERIALS</strong><div class="material-cards"><button class="material-card ${state.houseMaterial==='straw'?'selected':''}" onclick="previewMaterial('straw')">${svgStraw()}<b>Straw</b><small>Dried plants</small></button><button class="material-card ${state.houseMaterial==='sticks'?'selected':''}" onclick="previewMaterial('sticks')">${svgSticks()}<b>Sticks</b><small>Pieces of wood</small></button><button class="material-card ${state.houseMaterial==='bricks'?'selected':''}" onclick="previewMaterial('bricks')">${svgBricks()}<b>Bricks</b><small>Hard blocks used to build</small></button></div><div id="materialPreview" class="mode-panel">${materialPreview(state.houseMaterial||'')||'<strong>Choose a material to learn more.</strong><p>You will see what it is before you decide.</p>'}</div><div class="house-scene"><div class="sun"></div><div class="hill"></div>${svgHouse(state.houseMaterial||'')}</div></div><div class="branch"><strong>Why did you choose it?</strong></div><div class="reason-grid"><button class="choice" onclick="houseReason('fast')">It may take less time.</button><button class="choice" onclick="houseReason('strong')">It may be stronger.</button><button class="choice" onclick="houseReason('choice')">I like this choice.</button><button class="choice" onclick="houseReason('other')">I have another reason.</button></div><div id="houseFeedback" class="feedback ${state.houseReason?'':'hidden'}">${state.houseReasonText||''}</div><div class="final-action"><p><strong>Ready?</strong> Your final choice is the action that builds the house.</p><button id="buildHouseBtn" class="primary" onclick="buildHouse()">${state.houseMaterial&&state.houseReason?'Build My House':'Choose a material and reason'}</button></div><div class="local-celebration"><span class="local-confetti"><i></i><i></i><i></i><i></i></span>Activity complete — your house is built.</div>${state.houseBuilt?'<div class="built-message"><strong>Your house is built!</strong><p>You made a choice and followed it through.</p><div class="activity-complete">✓ Activity complete</div></div>':''}</div>`}
function materialPreview(m){if(!m)return '';const d={straw:['STRAW','Straw is dried plants. It is light and can be bundled together.'],sticks:['STICKS','Sticks are pieces of wood. They are pieces of wood that can be used to build.'],bricks:['BRICKS','Bricks are hard blocks used to build walls. They are heavy and strong.']}[m];return `<div class="material-detail"><div>${m==='straw'?svgStraw():m==='sticks'?svgSticks():svgBricks()}</div><div><strong>${d[0]}</strong><p>${d[1]}</p></div></div>`}
function previewMaterial(m){state.houseMaterial=m;state.houseBuilt=false;save();const p=document.getElementById('materialPreview');if(p)p.innerHTML=materialPreview(m);const scene=document.querySelector('#stageWrap .stage.active .house-scene');if(scene)scene.innerHTML='<div class="sun"></div><div class="hill"></div>'+svgHouse(m);document.querySelectorAll('.material-card').forEach(b=>b.classList.remove('selected'));const chosen=[...document.querySelectorAll('.material-card')].find(b=>b.querySelector('b')?.textContent.toLowerCase()===m);if(chosen)chosen.classList.add('selected');updateBuildButton();}
function houseReason(type){const msgs={fast:'You chose a reason about time.',strong:'You chose a reason about strength.',choice:'You chose because you liked it.',other:'Your reason matters too. Different people can make different choices.'};state.houseReason=type;state.houseReasonText=msgs[type];save();document.querySelectorAll('.reason-grid .choice').forEach(b=>b.classList.remove('selected'));const labels={fast:'It may take less time.',strong:'It may be stronger.',choice:'I like this choice.',other:'I have another reason.'};const chosen=[...document.querySelectorAll('.reason-grid .choice')].find(b=>b.textContent.trim()===labels[type]);if(chosen)chosen.classList.add('selected');const f=document.getElementById('houseFeedback');if(f){f.textContent=msgs[type];f.classList.remove('hidden')}updateBuildButton();}
function updateBuildButton(){const b=document.getElementById('buildHouseBtn');if(!b)return;const ready=!!(state.houseMaterial&&state.houseReason);b.disabled=!ready;b.setAttribute('aria-disabled',String(!ready));if(ready){b.textContent='Build My House';b.classList.add('ready-build')}else{b.textContent='Choose a material and reason';b.classList.remove('ready-build')}}
function buildHouse(){if(!state.houseMaterial||!state.houseReason){const f=document.getElementById('houseFeedback');if(f){f.textContent='Choose a material and a reason first. Then you can build your house.';f.classList.remove('hidden')}return;}state.houseBuilt=true;save();const c=document.querySelector('.local-celebration');if(c)c.classList.add('show');completeTask(1);setTimeout(()=>{state.storyStep=2;save();renderExperience();},550);setTimeout(()=>document.querySelector('#stageWrap .stage.active')?.focus?.({preventScroll:true}),0)}
function showAccessSupport(text){const panel=document.getElementById('accessVisual');if(!panel)return;let html='';const t=String(text).toLowerCase();if(t.includes('straw')||t.includes('sticks')||t.includes('bricks')){html=`<div class="access-visual-grid"><div><div class="access-art">${svgStraw()}</div><strong>Straw</strong><span>Dried plants</span></div><div><div class="access-art">${svgSticks()}</div><strong>Sticks</strong><span>Pieces of wood</span></div><div><div class="access-art">${svgBricks()}</div><strong>Bricks</strong><span>Hard blocks used to build</span></div></div><p><strong>Same information:</strong> three pigs, three houses, three materials.</p>`;}else if(t.includes('wolf')){html=`<div class="access-photo"><img src="assets/november-wolf-path.jpg" alt="Illustration of the wolf in a lush island setting"><div><strong>The wolf arrives at the house.</strong><span>Look at the picture while you listen or read.</span></div></div>`;}else{html=`<div class="access-photo"><img src="assets/november-pigs-path.jpg" alt="Illustration of the pigs and a house in a lush island setting"><div><strong>Look at the picture while you read or listen.</strong><span>The image gives you another way to connect with the information.</span></div></div>`;}panel.innerHTML=html;panel.classList.add('show');} 

function experienceStory3(){return `<div class="story-card activity3-card"><div class="chapter">EXPERIENCE THE STORY · ACTIVITY 3</div><h2>The wolf arrives.</h2><div class="story-text"><p><strong>The wolf comes to the house.</strong></p><p>“Little pig, little pig, let me come in!”</p></div><div class="story-visual activity3-visual"><div class="story-visual-card"><img src="assets/november-wolf-path.jpg" alt="The wolf near a house in a lush island setting" style="width:100%;height:180px;object-fit:cover;border-radius:12px"><strong>The wolf + the house</strong><span>The picture shows the main idea.</span></div></div><div class="story-tools"><button class="tool" onclick="speak('The wolf comes to the house. Little pig, little pig, let me come in!')">🔊 Hear it</button><button class="tool" onclick="showStageVisual('wolf')">👀 Show me</button><button class="tool" onclick="speak('The wolf comes to the house. Little pig, little pig, let me come in!')">📖 Read it</button></div><div id="stageVisual" class="access-visual-panel hidden"></div><div class="branch"><strong>What could the pig do?</strong></div><div class="choices"><button class="choice" onclick="chooseStory3(0,this,'Opening the door is one possible choice.')">Open the door</button><button class="choice" onclick="chooseStory3(0,this,'Saying no is one possible choice.')">Say no</button><button class="choice" onclick="chooseStory3(0,this,'Getting help is one possible choice.')">Get help</button><button class="choice" onclick="chooseStory3(0,this,'Asking why is one possible choice.')">Ask why</button></div><div id="choice1Feedback" class="feedback hidden"></div><div class="branch"><strong>The wolf blows on the house.</strong><span>What do you think might happen?</span></div><div class="story-visual activity3-visual"><div class="story-visual-card">${svgHouse(state.houseMaterial||'straw')}<strong>Wolf + house</strong><span>The house might stay or fall.</span></div></div><div class="choices"><button class="choice" onclick="chooseStory3(1,this,'The house might stay.')">It might stay.</button><button class="choice" onclick="chooseStory3(1,this,'The house might fall.')">It might fall.</button><button class="choice" onclick="chooseStory3(1,this,'It is okay not to know yet.')">I am not sure.</button></div><div id="choice2Feedback" class="feedback hidden"></div><div class="next"><button id="activity3Done" class="primary" onclick="completeActivity(2,3)" disabled>Continue to reflection →</button></div><div id="activity3Celebrate" class="local-celebration"><span class="local-confetti"><i></i><i></i><i></i><i></i></span>Activity complete — you made a choice and predicted what might happen.</div></div>`}
function perspective1(){return `<div class="story-card"><div class="chapter">HEAR ANOTHER SIDE · ACTIVITY 1</div><h2>Access the same story first.</h2><div class="story-text"><p>The pigs say the wolf came to their homes. The wolf says there is more to the story.</p></div>${accessLine('The pigs say the wolf came to their homes. The wolf says there is more to the story.')}<div class="branch"><strong>What helps you understand?</strong></div><div class="choices"><button class="choice" onclick="selectChoice(this,'Hearing is one way to access the information.')">🔊 Hear it</button><button class="choice" onclick="selectChoice(this,'Seeing is one way to access the information.')">👀 See it</button><button class="choice" onclick="selectChoice(this,'Reading is one way to access the information.')">📖 Read it</button><button class="choice" onclick="selectChoice(this,'A partner can help you access the information.')">🤝 Do it together</button></div><div class="next"><button class="primary" onclick="completeActivity(0,1)">I found a way that helps me →</button></div></div>`}
function perspective2(){return `<div class="story-card"><div class="chapter">HEAR ANOTHER SIDE · ACTIVITY 2</div><h2>Hear both sides.</h2><div class="social"><strong>🐷 THE PIGS SAY</strong><p>The wolf came to our homes and blew them down. We were scared.</p>${accessLine('The pigs say: The wolf came to our homes and blew them down. We were scared.')}</div><div class="social"><strong>🐺 THE WOLF SAYS</strong><p>I went to the pigs' houses. I say I was hungry and wanted food.</p>${accessLine('The wolf says: I went to the pigs houses. I was hungry and wanted food.')}</div><div class="branch"><strong>What is the same? What is different?</strong></div><div class="choices"><button class="choice" onclick="selectChoice(this,'Both sides talk about the houses.')">🏠 Both talk about the houses.</button><button class="choice" onclick="selectChoice(this,'The characters tell the event differently.')">🔄 They tell it differently.</button><button class="choice" onclick="selectChoice(this,'You can notice more than one thing.')">✨ Both are observations.</button></div><div class="next"><button class="primary" onclick="completeActivity(1,2)">I compared the two sides →</button></div></div>`}
function perspective3(){return `<div class="story-card"><div class="chapter">HEAR ANOTHER SIDE · ACTIVITY 3</div><h2>What do you think?</h2><p>You heard two perspectives. Who do you believe—or do you need more information?</p><div class="choices"><button class="choice" onclick="selectChoice(this,'You chose the pigs.')">🐷 I believe the pigs.</button><button class="choice" onclick="selectChoice(this,'You chose the wolf.')">🐺 I believe the wolf.</button><button class="choice" onclick="selectChoice(this,'Not being sure is a thoughtful choice.')">🤷 I am not sure.</button><button class="choice" onclick="selectChoice(this,'Looking for more information is part of literacy.')">🔎 I need more information.</button></div><p class="branch">Explain your thinking in the way that works for you: speech, writing, typing, drawing, pictures, symbols, AAC, or partner communication.</p><div class="next"><button class="primary" onclick="completeActivity(2,3)">Share my thinking →</button></div></div>`}
function investigate1(){return `<div class="story-card"><div class="chapter">INVESTIGATE THE STORY · ACTIVITY 1</div><h2>Access the information.</h2><div class="story-text"><p><strong>The pigs say:</strong> “The wolf came to our houses and blew them down.”</p><p><strong>The wolf says:</strong> “I came because I was hungry and wanted food.”</p></div>${accessLine('The pigs say the wolf came to their houses and blew them down. The wolf says he came because he was hungry and wanted food.')}<div class="branch"><strong>Which way helps you access this information?</strong></div><div class="choices"><button class="choice" onclick="selectChoice(this,'Hearing is a valid access choice.')">🔊 Hear</button><button class="choice" onclick="selectChoice(this,'Seeing is a valid access choice.')">👀 See</button><button class="choice" onclick="selectChoice(this,'Reading is a valid access choice.')">📖 Read</button><button class="choice" onclick="selectChoice(this,'Simplifying language is a valid access choice.')">🧩 Simplify</button></div><div class="next"><button class="primary" onclick="completeActivity(0,1)">I found a way to access it →</button></div></div>`}
function investigate2(){return `<div class="story-card"><div class="chapter">INVESTIGATE THE STORY · ACTIVITY 2</div><h2>Learn how information works.</h2><p>First we learn the words. Then we try them.</p><div class="evidence"><button onclick="selectEvidence(this)"><b>FACT</b><small>Something we can check.</small><span>“The wolf came to the house.”</span></button><button onclick="selectEvidence(this)"><b>CLAIM</b><small>Something someone says is true.</small><span>“The wolf wanted to hurt us.”</span></button><button onclick="selectEvidence(this)"><b>OPINION</b><small>What someone thinks or feels.</small><span>“The wolf is mean.”</span></button></div><div id="evidenceFeedback" class="feedback hidden"></div><div class="next"><button class="primary" onclick="completeActivity(1,2)">I can tell the difference →</button></div></div>`}
function investigate3(){return `<div class="story-card"><div class="chapter">INVESTIGATE THE STORY · ACTIVITY 3</div><h2>Use evidence to think.</h2><p>Which information could help you understand what happened?</p><div class="evidence"><button onclick="selectEvidence(this)">What the pigs say happened</button><button onclick="selectEvidence(this)">What the wolf says happened</button><button onclick="selectEvidence(this)">What happened to the houses</button><button onclick="selectEvidence(this)">A comment from someone who was not there</button></div><div id="evidenceFeedback" class="feedback hidden"></div><div class="social"><strong>📱 THE STORY GOES ONLINE</strong><p><b>@ThreeLittlePigs:</b> “THE WOLF ATTACKED OUR HOMES!”</p><p><b>@WolfOfficial:</b> “There are two sides to every story.”</p></div><div class="branch"><strong>What do you want to know before deciding?</strong></div><div class="choices"><button class="choice" onclick="selectChoice(this,'You want more information.')">🔎 I need more information.</button><button class="choice" onclick="selectChoice(this,'You are ready to explain your thinking.')">💬 I can explain my thinking.</button><button class="choice" onclick="selectChoice(this,'You can remain unsure while looking for evidence.')">🤷 I am not sure yet.</button></div><div class="next"><button class="primary" onclick="completeActivity(2,3)">Share my conclusion →</button></div></div>`}
function reflectionStage(){return `<div class="story-card"><div class="chapter">FAMILY REFLECTION</div><div class="reflection"><h2>You explored the story.</h2><p>Take a moment to reflect together. You can type, dictate, or have someone help communicate your response.</p><div class="q"><label for="r1">What did you notice?</label><textarea id="r1" placeholder="Type, dictate, or communicate your response.">${escapeHtml(state.reflection?.[0]||'')}</textarea></div><div class="q"><label for="r2">What helped your child access the experience?</label><textarea id="r2" placeholder="A way of seeing, hearing, reading, choosing, or working together.">${escapeHtml(state.reflection?.[1]||'')}</textarea></div><div class="q"><label for="r3">Anything else you want to remember?</label><textarea id="r3" placeholder="Optional.">${escapeHtml(state.reflection?.[2]||'')}</textarea></div><div class="save-reflection"><button class="primary" onclick="saveReflectionAndFinish()">Save Reflection →</button></div><div id="stampEarned" class="stamp-earned ${state.complete?'show':''}"><div class="stamp"><div><small>NOVEMBER</small><strong>LITERACY<br>IS ACCESS</strong><small>2026 ✓</small></div></div><p><strong>🎊 Stamp earned!</strong> Your November experience is complete.</p></div></div></div>`}
function goStage(next){const stages=[...document.querySelectorAll('#stageWrap .stage')];if(!stages.length)return;state.storyStep=next;save();stages.forEach((el,i)=>el.classList.toggle('active',i===next));updateJourney();const active=stages[next];if(active){active.setAttribute('tabindex','-1');active.focus({preventScroll:true})}}
function completeActivity(index,next){if(!state.tasks[index])completeTask(index);state.storyStep=next;save();renderExperience();setTimeout(()=>{const wrap=document.getElementById('stageWrap');if(!wrap)return;const headerH=document.querySelector('header')?.offsetHeight||74;const target=Math.max(0,wrap.getBoundingClientRect().top+window.scrollY-headerH-12);window.scrollTo({top:target,behavior:'auto'});setTimeout(()=>{const target2=Math.max(0,wrap.getBoundingClientRect().top+window.scrollY-headerH-12);window.scrollTo(0,target2);},300)},120)}
function completeTask(index){if(state.tasks[index])return;state.tasks[index]=true;save();updateJourney();if(index<3){popSound();confetti(55)}const c=document.querySelector('.stage.active .local-celebration');if(c)c.classList.add('show')}
function speakCurrent(){const active=document.querySelector('.stage.active');if(active){repeatDirection();return}speak('The Three Little Pigs. We all know the story, but do we? The same story can be accessed in different ways. Choose the tools that help you.')} 
function repeatDirection(){const active=document.querySelector('.stage.active');if(!active){speakCurrent();return}const text=active.innerText.replace(/\s+/g,' ').slice(0,900);speak(text)}
function updateJourney(){const items=document.querySelectorAll('.journey-item');items.forEach((el,i)=>{el.classList.toggle('complete',!!state.tasks[i]);const c=el.querySelector('.journey-check');if(c)c.textContent=state.tasks[i]?'✓':''});const strong=document.querySelector('.passport-progress strong');if(strong)strong.textContent=`${state.tasks.filter(Boolean).length} of 4 complete`}
function choosePath(path){state.path=path;state.storyStep=0;state.houseBlocks=[];state.houseMaterial='';state.houseReason='';state.houseReasonText='';save();renderExperience();setTimeout(()=>document.getElementById('stageWrap')?.focus?.({preventScroll:true}),0)}
function selectChoice(btn,msg){btn.parentElement.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');const f=btn.parentElement.nextElementSibling;if(f&&f.classList.contains('feedback')){f.textContent=msg;f.classList.remove('hidden')}const stage=btn.closest('.stage');if(stage?.querySelector('#activity1Done')){const hasAccess=!!stage.querySelector('#stageFeedback')?.textContent;stage.querySelector('#activity1Done').disabled=!hasAccess}}
function chooseStory3(group,btn,msg){const card=btn.closest('.story-card'),groups=card.querySelectorAll('.choices');groups[group].querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');const f=document.getElementById(group===0?'choice1Feedback':'choice2Feedback');f.textContent=msg;f.classList.remove('hidden');const done=!!groups[0].querySelector('.choice.selected')&&!!groups[1].querySelector('.choice.selected');document.getElementById('activity3Done').disabled=!done;if(done)document.getElementById('activity3Celebrate').classList.add('show')}
function showStageVisual(kind){const p=document.getElementById('stageVisual');if(!p)return;p.classList.remove('hidden');p.innerHTML=`<h4>SEE IT</h4><div class="access-photo"><img src="assets/november-wolf-path.jpg" alt="Illustration of the wolf arriving near a house in a lush island setting"><div><strong>The wolf arrives at the house.</strong><span>Look at the picture while you read or listen to the words.</span></div></div>`}

function selectEvidence(btn){btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');const f=document.getElementById('evidenceFeedback');if(f){f.textContent='This is information you can use to think about the story. Ask: Who said it? What happened? Can we check it?';f.classList.remove('hidden')}}
function toggleSupport(){state.supported=!state.supported;save();applySupportClass();const b=document.getElementById('supportBtn');if(b)b.textContent=state.supported?'👀 Hide visual supports':'👀 Show me';const stage=document.querySelector('.stage.active');if(stage&&state.supported)showUniversalVisual(stage);else {const card=document.querySelector('.stage-wrap .story-card');if(card&&state.supported)showUniversalVisual(card);else document.getElementById('universalVisual')?.classList.add('hidden')}}
function showUniversalVisual(stage){let p=document.getElementById('universalVisual');if(!p){p=document.createElement('div');p.id='universalVisual';p.className='access-visual-panel'};(stage.querySelector?.('.story-card')||stage).appendChild(p);const text=(stage.innerText||'').toLowerCase();if(text.includes('wolf'))p.innerHTML=`<h4>SEE IT</h4><div class="access-photo"><img src="assets/november-wolf-path.jpg" alt="Illustration of the wolf and house"><div><strong>Wolf + house</strong><span>This picture supports the main information on this screen.</span></div></div>`;else if(text.includes('house')||text.includes('straw')||text.includes('sticks')||text.includes('bricks'))p.innerHTML=`<h4>SEE IT</h4><div class="story-visual"><div class="story-visual-card">${svgStraw()}<strong>Straw</strong><span>Dried plants</span></div><div class="story-visual-card">${svgSticks()}<strong>Sticks</strong><span>Pieces of wood</span></div><div class="story-visual-card">${svgBricks()}<strong>Bricks</strong><span>Hard blocks used to build</span></div></div><p>The pictures show the main information in another way.</p>`;else p.innerHTML=`<h4>SEE IT</h4><div class="access-photo"><img src="assets/november-pigs-path.jpg" alt="Illustration of the pigs and a house"><div><strong>Pigs + house</strong><span>This picture supports the main information on this screen.</span></div></div>`;p.classList.remove('hidden')}

function applySupportClass(){document.body.classList.toggle('supported',!!state.supported)}
function toggleTextSize(direction){let level=Number(document.body.dataset.textSize||0)+direction;level=Math.max(-1,Math.min(2,level));document.body.dataset.textSize=level;document.body.classList.toggle('largeText',level!==0);document.body.style.fontSize=level===-1?'95%':level===1?'110%':level===2?'120%':''}
function saveReflectionAndFinish(){const vals=[document.getElementById('r1')?.value||'',document.getElementById('r2')?.value||'',document.getElementById('r3')?.value||''];state.reflection=vals;state.complete=true;save();completeTask(3);document.getElementById('stampEarned')?.classList.add('show');updateCount();updateJourney();confetti(180);gentleApplause();setTimeout(()=>document.getElementById('stampEarned')?.scrollIntoView({behavior:'smooth',block:'center'}),120);setTimeout(showCompletionModal,700)}
function showCompletionModal(){document.getElementById('completionModal').classList.add('show');confetti(180)}
function closeModalAndHome(){document.getElementById('completionModal').classList.remove('show');showHome()}
function showStamps(){homeEl.style.display='none';expEl.classList.remove('active');stampsEl.classList.add('active');document.getElementById('homeNav').classList.remove('active');stampsEl.innerHTML=`<button class="back" onclick="showHome()">← Back to Passport</button><section class="experience-shell"><div class="experience-content"><div class="chapter">YOUR PASSPORT</div><h1 style="font-size:clamp(40px,6vw,60px);margin:10px 0">Your Stamps</h1><p style="font-size:18px;color:#506579">Each completed experience earns a digital stamp.</p><div class="stamp-earned show"><div class="stamp"><div><small>NOVEMBER</small><strong>LITERACY<br>IS ACCESS</strong><small>${state.complete?'2026 ✓':'LOCKED'}</small></div></div><p><strong>${state.complete?'Your first passport stamp is yours!':'Complete the November experience to earn your first stamp.'}</strong></p></div><div class="progress-strip"><strong>Passport progress:</strong> ${state.complete?'1':'0'} / 8 experiences complete</div><div style="margin-top:24px"><button class="secondary" onclick="resetTestPassport()">Reset this test passport</button><p style="font-size:13px;color:#8a8a8a">For testing only. Resets progress saved on this browser.</p></div></div></section>`;window.scrollTo(0,0)}
function resetTestPassport(){if(!confirm('Reset this browser’s Family Literacy Passport test progress back to 0/8?'))return;localStorage.removeItem('flp');state={...defaultState,tasks:[false,false,false,false],houseBlocks:[],houseBuilt:false,reflection:['','',''],started:false};showHome()}
function escapeHtml(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
let speechTimer=null;
function speak(t){if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){alert('Audio is not available in this browser. Try Chrome or Safari.');return}const synth=window.speechSynthesis;if(speechTimer)clearTimeout(speechTimer);synth.cancel();const play=()=>{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.92;const voices=synth.getVoices();const v=voices.find(v=>v.lang&&v.lang.toLowerCase()==='en-us')||voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('en'));if(v)u.voice=v;synth.resume();synth.speak(u);speechTimer=setTimeout(()=>{if(!synth.speaking)synth.speak(u)},700)};if(synth.getVoices().length)play();else{const old=synth.onvoiceschanged;synth.onvoiceschanged=()=>{synth.onvoiceschanged=old||null;play()};speechTimer=setTimeout(play,800);synth.getVoices()}}
function audioCtx(){window.__flpAudio=window.__flpAudio||new (window.AudioContext||window.webkitAudioContext)();if(window.__flpAudio.state==='suspended')window.__flpAudio.resume();return window.__flpAudio}
function popSound(){try{const c=audioCtx(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type='sine';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(900,t+.09);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.13);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.14)}catch(e){}}
function gentleApplause(){try{const c=audioCtx(),t=c.currentTime;for(let i=0;i<12;i++){const b=c.createBuffer(1,c.sampleRate*.16,c.sampleRate),d=b.getChannelData(0);for(let j=0;j<d.length;j++){const fade=Math.sin(Math.PI*j/d.length);d[j]=(Math.random()*2-1)*fade*.16}const src=c.createBufferSource(),filter=c.createBiquadFilter(),g=c.createGain();src.buffer=b;filter.type='lowpass';filter.frequency.value=1700;g.gain.setValueAtTime(.0001,t+i*.13);g.gain.exponentialRampToValueAtTime(.045,t+i*.13+.025);g.gain.exponentialRampToValueAtTime(.0001,t+i*.13+.12);src.connect(filter).connect(g).connect(c.destination);src.start(t+i*.13)}}catch(e){}}
function confetti(n){const c=document.getElementById('confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let p=Array.from({length:n},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*12-3,s:Math.random()*8+4,r:Math.random()*6})),st=performance.now();function f(t){x.clearRect(0,0,c.width,c.height);p.forEach(a=>{a.x+=a.vx;a.vy+=.45;a.y+=a.vy;a.r+=.2;x.save();x.translate(a.x,a.y);x.rotate(a.r);x.fillStyle=['#f15a3c','#ffbd3f','#2fa7a5','#58a56b','#4ba2d0','#d84b79'][Math.floor(Math.random()*6)];x.fillRect(-a.s/2,-a.s/2,a.s,a.s*1.6);x.restore()});if(t-st<1300)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)}requestAnimationFrame(f)}
showHome();
