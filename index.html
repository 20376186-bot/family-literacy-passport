<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#073b5c"><link rel="manifest" href="manifest.webmanifest">
<title>Family Literacy Passport</title>
<style>
:root{--navy:#073b5c;--cream:#fffaf0;--ink:#18324a;--muted:#607287;--gold:#ffbd3f;--paper:#f0e9dc;--orange:#f15a3c;--teal:#2fa7a5;--green:#58a56b;--blue:#4ba2d0;--pink:#d84b79;--line:#dfd1b8}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(#dfd4c1 1.2px,transparent 1.2px) 0 0/18px 18px,var(--cream)}
button,textarea{font:inherit}button{cursor:pointer}
header{height:74px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:850}.spark{width:40px;height:40px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center}
nav{display:flex;gap:8px}.navbtn{border:0;background:transparent;color:white;padding:12px 17px;border-radius:28px;font-weight:800}.navbtn.active{background:#ffffff22}.count{background:var(--gold);color:var(--navy);border-radius:20px;padding:4px 9px;margin-left:5px}
main{max-width:1420px;margin:auto;padding:32px 28px 60px}.hero{border-radius:38px;background:radial-gradient(circle at 25% 20%,#135777,#073a5a 52%,#102d4d);color:white;padding:55px 60px;box-shadow:0 14px 35px #142d4122;overflow:hidden}
.hero-inner{display:flex;justify-content:space-between;align-items:center;gap:40px}.eyebrow{letter-spacing:6px;font-weight:900;color:var(--gold)}h1{font-size:clamp(50px,7vw,88px);line-height:.95;margin:24px 0;letter-spacing:-3px}.tagline{font-size:26px;font-weight:850}.subtag{font-size:19px;font-style:italic;color:#d7e1e9;margin-top:12px}
.progressbox{width:400px;background:#294a69dd;border:1px solid #ffffff2b;border-radius:28px;padding:28px}.bigcount{font-size:62px;font-weight:900}.bigcount span{color:var(--gold)}.smallcaps{font-size:14px;font-weight:900;letter-spacing:2px}.bar{height:14px;background:#ffffff25;border-radius:20px;overflow:hidden;margin:18px 0 22px}.bar>div{height:100%;background:var(--gold);transition:.4s}.primary{border:0;background:var(--gold);color:#082d48;font-weight:900;border-radius:30px;padding:15px 24px;font-size:18px}
.sectionhead{display:flex;justify-content:space-between;align-items:end;margin:55px 0 22px}.sectionhead h2{font-size:42px;margin:0}.sectionhead p{font-size:19px;color:#43566b}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.card{background:#fffdf8;border:1px solid var(--line);border-radius:27px;overflow:hidden;display:flex;flex-direction:column;min-height:425px}.cardtop{height:68px;padding:17px 23px;color:white;font-weight:900;display:flex;justify-content:space-between}.cardbody{padding:24px 27px;display:flex;flex-direction:column;flex:1}.date{font-weight:800;color:#607287}.card h3{font-size:30px;line-height:1.1;margin:11px 0}.quote{font-size:18px;font-weight:850;font-style:italic}.desc{color:#506579;font-size:16px;line-height:1.5}.status{margin-top:auto;align-self:flex-start;border:0;border-radius:24px;padding:10px 16px;font-weight:850;background:#f1ebdf;color:#617387}.status.ready{background:var(--gold);color:#143149}
.experience{background:#fffdf8;border:1px solid var(--line);border-radius:32px;overflow:hidden}.exphead{background:var(--orange);color:white;padding:21px 32px;display:flex;justify-content:space-between;font-weight:900;letter-spacing:2px}.expbody{padding:38px 58px}.back{border:0;background:none;color:#06648b;font-weight:850;font-size:18px;padding:0 0 16px}.exp-title{font-size:62px;line-height:1;margin:12px 0}.quote2{font-size:25px;color:var(--orange);font-style:italic;font-weight:900}.welcome{margin-top:30px;background:var(--paper);border-radius:26px;padding:27px 31px}.welcome h3{margin:0 0 10px;font-size:16px;letter-spacing:2px}.welcome strong{display:block;font-size:24px;line-height:1.35}.welcome p{font-size:18px;color:#506579;line-height:1.55}.listen{border:2px solid #06648b;color:#06648b;background:transparent;border-radius:28px;padding:11px 17px;font-weight:850}
.activity{margin-top:30px;border:2px dashed #d9cbb5;border-radius:24px;padding:38px;text-align:center}.activity h3{font-size:28px;margin:8px 0}.activity p{color:#53687b;font-size:18px}
.lower{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:30px}.panel{background:#fffdf8;border:1px solid var(--line);border-radius:27px;padding:25px}.panel h3{margin:0;font-size:26px}.panelhead{display:flex;justify-content:space-between;align-items:center}.tasks{margin-top:18px;display:grid;gap:11px}.task{border:2px solid #e0d3bd;border-radius:17px;padding:14px;display:flex;align-items:center;gap:11px}.task.done{background:#f1f8f0;border-color:#9bc6a4}.check{width:40px;height:40px;border:2px solid #d8cbb5;border-radius:50%;display:grid;place-items:center;flex:none}.done .check{background:var(--green);border-color:var(--green);color:white}.tasktext{font-weight:750;flex:1}.done .tasktext{text-decoration:line-through;color:#698071}.task button{border:0;background:#05658a;color:white;border-radius:22px;padding:9px 13px;font-weight:850}.task.done button{background:#dcebdc;color:#367247}
.reflect{margin-top:18px;display:grid;gap:14px}.q{background:var(--paper);border-radius:19px;padding:17px}.qhead{font-weight:850;font-size:17px;margin-bottom:9px}.num{display:inline-grid;place-items:center;width:29px;height:29px;border-radius:50%;color:white;margin-right:7px}.q:nth-child(1) .num{background:var(--orange)}.q:nth-child(2) .num{background:var(--teal)}.q:nth-child(3) .num{background:var(--green)}textarea{width:100%;min-height:78px;border:2px solid #d9cbb7;border-radius:15px;background:#fffdf8;padding:11px;resize:vertical;color:var(--ink)}.saved{font-size:13px;color:#607287}.stampwrap{display:flex;justify-content:center;padding:25px}.stamp{width:190px;height:190px;border:6px double var(--gold);border-radius:50%;display:grid;place-items:center;text-align:center;background:#fff9e9;transform:rotate(-6deg);font-weight:900}.stamp small{display:block;letter-spacing:3px}.stamp strong{display:block;font-size:25px}
.celebrate{position:fixed;inset:0;background:#073b5cdd;display:none;place-items:center;z-index:50}.celebrate.show{display:grid}.modal{background:#fffdf8;border-radius:28px;padding:42px;max-width:510px;text-align:center}.modal h2{font-size:43px;margin:0 0 8px}.modal p{font-size:19px;color:#526579}.close{border:0;background:var(--gold);padding:13px 24px;border-radius:24px;font-weight:900}canvas{position:fixed;inset:0;pointer-events:none;z-index:60}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.hero-inner{flex-direction:column;align-items:flex-start}.progressbox{width:100%}.lower{grid-template-columns:1fr}}@media(max-width:650px){header{padding:0 12px}.brand{font-size:16px}.navbtn{padding:8px}.hero{padding:32px 22px;border-radius:25px}.expbody{padding:26px 20px}.exp-title{font-size:43px}.grid{grid-template-columns:1fr}.sectionhead{display:block}.sectionhead h2{font-size:34px}.lower{grid-template-columns:1fr}}
</style></head>
<body>
<header><div class="brand"><div class="spark">✦</div>Family Literacy Passport</div><nav><button class="navbtn active" onclick="home()">▣ Passport</button><button class="navbtn" onclick="stamps()">♟ Stamps <span class="count" id="count">0/8</span></button></nav></header>
<main id="app"></main>
<div class="celebrate" id="celebrate"><div class="modal"><div id="icon" style="font-size:60px">🎉</div><h2 id="ctitle">Nice work!</h2><p id="ctext">You completed a task.</p><button class="close" onclick="closeCelebrate()">Continue</button></div></div><canvas id="confetti"></canvas>
<script>
const ex=[
["November 18, 2026","Literacy Is Access","Same goal. Different paths.","Discover the many ways your child can take in information and use it to decide what to do next.","#f15a3c","⌕"],
["December 16, 2026","Literacy in My World","Literacy is everywhere.","Spot signs, labels, menus and symbols in everyday places.","#2fa7a5","◉"],
["January 20, 2027","Choose Your Literacy","Choice increases engagement.","Explore what your child loves to read, watch, and hear.","#f7bd55","◇"],
["February 17, 2027","Read It. Do It.","Literacy helps us do things.","Follow a recipe, a map, or a set of steps together.","#58a56b","☷"],
["March 24, 2027","Everyone Has a Voice","Communication is access.","Celebrate every way your child communicates.","#d84b79","○"],
["April 21, 2027","Find What Works","Tools can increase access.","Try tools and supports that open doors to information.","#4ba2d0","⚒"],
["May 19, 2027","Literacy for My Future","Literacy supports independence.","Connect literacy to work, community, and independent living.","#f07858","♧"],
["June 16, 2027","Our Literacy Stories","Everyone has a literacy story.","Share and celebrate your family's year of discovery.","#2fa7a5","▣"]
];
const tasks=["Participate in the November literacy experience","Try the activity with our child","Explore a different way to access information","Complete the family reflection"];
let state=JSON.parse(localStorage.getItem("flp")||'{"tasks":[false,false,false,false],"reflection":["","",""],"complete":false}');
const save=()=>localStorage.setItem("flp",JSON.stringify(state));
const esc=s=>String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
function nav(){document.getElementById("count").textContent=(state.complete?1:0)+"/8"}
function home(){nav();app.innerHTML=`<section class="hero"><div class="hero-inner"><div><div class="eyebrow">HAWAIʻI · 2026–2027</div><h1>Family<br>Literacy<br>Passport</h1><div class="tagline">Explore • Experience • Grow</div><div class="subtag">A Year of Discovery Through Literacy</div></div><div class="progressbox"><div class="bigcount"><span>${state.complete?1:0}</span> / 8</div><div class="smallcaps">EXPERIENCES COMPLETE</div><div class="bar"><div style="width:${state.complete?12.5:0}%"></div></div><button class="primary" onclick="openOctober()">${state.complete?"Review November":"Start November"} →</button></div></div></section><div class="sectionhead"><h2>Your passport stops</h2><p>Same goal. Different paths.</p></div><section class="grid">${ex.map((e,i)=>`<article class="card"><div class="cardtop" style="background:${e[4]}"><span>STOP ${i+1}</span><span>${e[5]}</span></div><div class="cardbody"><div class="date">${e[0]}</div><h3>${e[1]}</h3><p class="quote" style="color:${e[4]}">“${e[2]}”</p><p class="desc">${e[3]}</p>${i===0?`<button class="status ready" onclick="openOctober()">${state.complete?"Completed ✓":"Not Started →"}</button>`:`<button class="status">◷ Coming soon</button>`}</div></article>`).join("")}</section>`}
function openOctober(){app.innerHTML=`<button class="back" onclick="home()">← Passport home</button><section class="experience"><div class="exphead"><span>NOVEMBER 18, 2026</span><span>Stop 1 of 8</span></div><div class="expbody"><div style="font-size:60px;color:var(--orange)">⌕</div><h1 class="exp-title">Literacy Is Access</h1><div class="quote2">“Same goal. Different paths.”</div><div class="welcome"><h3>WELCOME</h3><strong>Discover the many ways your child can take in information and use it to decide what to do next.</strong><p>There's no single right way to take part. Your child might read, listen, look at pictures, watch you model, point, use their AAC, or ask for help. Every way counts.</p><button class="listen" onclick="speak('There is no single right way to take part. Your child might read, listen, look at pictures, watch you model, point, use their AAC, or ask for help. Every way counts.')">🔊 Listen</button></div><div class="activity"><div style="font-size:45px">✦</div><div class="smallcaps">EXPERIENCE</div><h3>November Activity Coming Soon</h3><p>Your family's November literacy experience will appear here.</p></div><div class="lower"><div class="panel"><div class="panelhead"><h3>Passport tasks</h3><strong>${state.tasks.filter(Boolean).length} / 4</strong></div><div class="bar" style="background:#e8dfd1"><div style="width:${state.tasks.filter(Boolean).length*25}%;background:var(--orange)"></div></div><div class="tasks">${tasks.map((t,i)=>`<div class="task ${state.tasks[i]?"done":""}"><div class="check">${state.tasks[i]?"✓":""}</div><div class="tasktext">${t}</div><button onclick="task(${i})">${state.tasks[i]?"Done":"I did it!"}</button></div>`).join("")}</div></div><div class="panel"><h3>♡ Family reflection</h3><p style="color:#607287">Optional. Type, use voice-to-text, or talk it over together. This is about discovery, not a test.</p><div class="reflect">${["What did we notice?","What helped our child participate?","What could we try at home?"].map((q,i)=>`<div class="q"><div class="qhead"><span class="num">${i+1}</span>${q}</div><textarea oninput="reflection(${i},this.value)">${esc(state.reflection[i])}</textarea></div>`).join("")}</div><div class="saved">Saved automatically on this device.</div></div></div></div></section>`}
function reflection(i,v){state.reflection[i]=v;save()}
function task(i){if(state.tasks[i])return;state.tasks[i]=true;save();openOctober();confetti(30);if(state.tasks.every(Boolean)&&!state.complete){state.complete=true;save();setTimeout(()=>celebrate(),250)}}
function celebrate(){confetti(180);icon.textContent="🏅";ctitle.textContent="November complete!";ctext.textContent="You earned your first passport stamp. Your progress is now 1 / 8.";celebrate.classList.add("show")}
function closeCelebrate(){celebrate.classList.remove("show");openOctober()}
function stamps(){app.innerHTML=`<button class="back" onclick="home()">← Passport home</button><section class="panel"><h2 style="font-size:42px">Your passport stamps</h2><p style="color:#607287;font-size:18px">Each completed experience earns a digital stamp.</p><div class="stampwrap">${state.complete?'<div class="stamp"><div><small>NOVEMBER</small><strong>LITERACY<br>IS ACCESS</strong><small>2026 ✓</small></div></div>':'<div class="stamp" style="opacity:.4"><div><small>NOVEMBER</small><strong>LOCKED</strong><small>Complete the experience</small></div></div>'}</div></section>`}
function speak(t){if("speechSynthesis"in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}}
function confetti(n){const c=document.getElementById("confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;let p=Array.from({length:n},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*12-3,s:Math.random()*8+4,r:Math.random()*6})),st=performance.now();function f(t){x.clearRect(0,0,c.width,c.height);p.forEach(a=>{a.x+=a.vx;a.vy+=.45;a.y+=a.vy;a.r+=.2;x.save();x.translate(a.x,a.y);x.rotate(a.r);x.fillStyle=["#f15a3c","#ffbd3f","#2fa7a5","#58a56b","#4ba2d0","#d84b79"][Math.floor(Math.random()*6)];x.fillRect(-a.s/2,-a.s/2,a.s,a.s*1.6);x.restore()});if(t-st<1300)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)}requestAnimationFrame(f)}
home();
</script></body></html>
