<title>Family Literacy Passport</title>
<style>
:root{--navy:#073b5c;--cream:#fffaf0;--ink:#18324a;--muted:#607287;--gold:#ffbd3f;--paper:#f0e9dc;--orange:#c86f42;--teal:#2f9695;--green:#58a56b;--line:#dfd1b8;--white:#fffdf8}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(#dfd4c1 1.2px,transparent 1.2px) 0 0/18px 18px,var(--cream)}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:4px solid #ffbd3f;outline-offset:3px}
header{height:74px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:900}.spark{width:40px;height:40px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-size:22px}.nav{display:flex;gap:8px}.navbtn{border:0;background:transparent;color:#fff;padding:11px 16px;border-radius:24px;font-weight:850}.navbtn.active{background:#ffffff22}.count{background:var(--gold);color:var(--navy);border-radius:20px;padding:4px 9px;margin-left:5px}
main{max-width:1420px;margin:auto;padding:30px 28px 70px}.hero{border-radius:36px;background:radial-gradient(circle at 25% 20%,#135777,#073a5a 52%,#102d4d);color:#fff;padding:52px 56px;box-shadow:0 14px 35px #142d4122}.hero-inner{display:flex;justify-content:space-between;align-items:center;gap:40px}.eyebrow{letter-spacing:4px;font-weight:900;color:var(--gold);font-size:14px}.hero h1{font-size:clamp(48px,7vw,82px);line-height:.94;margin:20px 0;letter-spacing:-3px}.tagline{font-size:25px;font-weight:850}.subtag{font-size:18px;color:#d7e1e9;margin-top:10px}.progressbox{width:390px;background:#294a69dd;border:1px solid #ffffff2b;border-radius:27px;padding:26px}.bigcount{font-size:60px;font-weight:900}.bigcount span{color:var(--gold)}.smallcaps{font-size:13px;font-weight:900;letter-spacing:2px}.bar{height:13px;background:#ffffff25;border-radius:20px;overflow:hidden;margin:16px 0 21px}.bar>div{height:100%;background:var(--gold);transition:.4s}.primary{border:0;background:var(--gold);color:#082d48;font-weight:900;border-radius:28px;padding:14px 22px;font-size:17px}.secondary{border:2px solid #d6c8b1;background:#fff;color:var(--ink);font-weight:850;border-radius:26px;padding:12px 18px}
.sectionhead{display:flex;justify-content:space-between;align-items:end;margin:48px 0 20px}.sectionhead h2{font-size:40px;margin:0}.sectionhead p{font-size:18px;color:#43566b}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.card{background:var(--white);border:1px solid var(--line);border-radius:26px;overflow:hidden;display:flex;flex-direction:column;min-height:400px;box-shadow:0 5px 18px #263d4a0a}.cardtop{height:58px;padding:16px 21px;color:#fff;font-weight:900;display:flex;justify-content:space-between}.cardart{height:118px;background:#f0e9dc;display:flex;align-items:center;justify-content:center;padding:15px 20px;position:relative;overflow:hidden}.cardart img{width:100%;height:100%;object-fit:cover;border-radius:12px}.artlabel{position:absolute;left:28px;bottom:22px;background:#073b5ce8;color:#fff;padding:7px 11px;border-radius:12px;font-weight:850}.cardbody{padding:20px 22px;display:flex;flex-direction:column;flex:1}.date{font-weight:800;color:#607287;font-size:14px}.card h3{font-size:27px;line-height:1.1;margin:9px 0}.quote{font-size:17px;font-weight:850;font-style:italic;margin:0 0 8px}.desc{color:#506579;font-size:15px;line-height:1.45;margin:0}.themehint{color:#7b6d5a;font-size:13px;font-weight:750;margin-top:10px}.status{margin-top:auto;align-self:flex-start;border:0;border-radius:24px;padding:10px 16px;font-weight:850;background:#f1ebdf;color:#617387}.status.ready{background:var(--gold);color:#143149}.status.done{background:#dcebdc;color:#367247}
/* Experience shell */
.experience-page{display:none}.experience-page.active{display:block}.back{border:0;background:none;color:#06648b;font-weight:850;font-size:17px;padding:0;margin:4px 0 17px}.experience-shell{background:var(--white);border:1px solid var(--line);border-radius:32px;overflow:hidden;box-shadow:0 7px 24px #263d4a10}.expbar{background:var(--orange);color:#fff;padding:18px 28px;display:flex;justify-content:space-between;font-weight:900;letter-spacing:1.5px}.experience-content{padding:30px 48px 46px}.experience-hero{position:relative;border-radius:24px;overflow:hidden;min-height:280px;background:#173e52}.experience-hero img{width:100%;height:100%;min-height:280px;object-fit:cover;display:block}.experience-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#062c42dd 0%,#062c4255 55%,transparent 100%)}.hero-copy{position:absolute;z-index:1;left:34px;top:50%;transform:translateY(-50%);color:#fff;max-width:620px}.hero-copy h2{font-size:clamp(42px,6vw,68px);line-height:.95;margin:12px 0}.hero-copy p{font-size:25px;font-weight:800;margin:0}.intro{padding:30px 4px 18px}.intro h1{font-size:clamp(38px,5vw,58px);margin:0 0 8px;line-height:1}.intro .hook{font-size:24px;color:var(--orange);font-style:italic;font-weight:900;margin:0}.intro-copy{max-width:850px;color:#506579;font-size:18px;line-height:1.6;margin-top:12px}
.access-panel{background:var(--paper);border-radius:24px;padding:24px}.access-panel h3{margin:0 0 7px;font-size:18px;letter-spacing:1.5px}.access-panel p{margin:0;color:#506579;font-size:17px;line-height:1.5}.access-tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:17px}.tool{border:2px solid #c8bba7;background:#fff;border-radius:23px;padding:10px 14px;font-weight:850;color:#36546b}.tool.selected{border-color:var(--teal);background:#eaf5f3}.pathgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:20px}.pathcard{border:2px solid #d9cbb7;background:#fffdf8;border-radius:20px;padding:0;overflow:hidden;text-align:left;color:var(--ink);transition:.15s;box-shadow:0 2px 8px #263d4a0a}.pathcard:hover{transform:translateY(-2px);border-color:var(--teal)}.pathcard.selected{border-color:var(--orange);box-shadow:0 0 0 3px #c86f4222}.pathcard img{width:100%;height:150px;object-fit:cover;display:block}.pathcopy{padding:15px}.pathcopy strong{display:block;font-size:20px}.pathcopy small{display:block;color:#607287;line-height:1.35;margin-top:4px}.supportnote{font-size:14px;color:#607287;margin-top:9px}
.stage-wrap{margin-top:25px}.stage{display:none}.stage.active{display:block}.story-card{background:#f7f1e7;border-radius:24px;padding:28px}.story-card h2{font-size:32px;line-height:1.1;margin:7px 0 12px}.story-card p{font-size:18px;line-height:1.62;color:#3f566b}.chapter{font-size:13px;font-weight:900;letter-spacing:2px;color:#7b6d5a}.story-tools{display:flex;flex-wrap:wrap;gap:10px;margin:17px 0}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}.choice{border:2px solid #d8cbb5;background:#fffdf8;border-radius:17px;padding:16px;text-align:left;font-weight:850;color:var(--ink);min-height:68px}.choice:hover{border-color:var(--teal)}.choice.selected{border-color:var(--green);background:#eef8ef}.feedback{margin-top:15px;padding:14px 16px;border-radius:15px;background:#eaf5f3;font-weight:750;color:#27495d}.branch{margin-top:20px;border-left:5px solid var(--teal);padding:5px 0 5px 18px}.branch strong{display:block;margin-bottom:4px}.house{margin-top:22px;background:#fffdf8;border:1px solid #dccfb9;border-radius:20px;padding:20px}.materials{display:flex;flex-wrap:wrap;gap:10px;margin-top:13px}.material{border:2px solid #d8cbb5;background:#fff;border-radius:16px;padding:12px 15px;font-weight:850}.material.selected{border-color:var(--orange);background:#fff4ee}.swatch{display:inline-block;width:22px;height:22px;border-radius:5px;vertical-align:middle;margin-right:7px;border:1px solid #8c7a64}.straw{background:#d9c36a}.sticks{background:#8c6544}.bricks{background:#b75b45}.house-building{min-height:135px;margin-top:17px;border-radius:17px;background:linear-gradient(#b8d6e2 0 58%,#78a866 58%);position:relative;display:flex;align-items:end;justify-content:center;padding-bottom:15px;overflow:hidden}.house-shape{width:145px;height:88px;background:#d0b080;border:4px solid #6d5338;position:relative;display:flex;flex-wrap:wrap;align-content:flex-end;padding:4px;gap:3px}.roof{position:absolute;top:-47px;left:-12px;width:0;height:0;border-left:82px solid transparent;border-right:82px solid transparent;border-bottom:52px solid #8c5d45}.block{width:29px;height:16px;border-radius:2px;border:1px solid #765c45}.social{background:#eef3f8;border:1px solid #cdd9e5;border-radius:20px;padding:18px;margin:14px 0}.social strong{display:block}.social p{margin:8px 0 0;font-size:16px}.evidence{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:17px}.evidence button{border:2px solid #d9cbb7;background:#fffdf8;border-radius:15px;padding:14px;text-align:left;font-weight:800}.evidence button.selected{border-color:var(--green);background:#eef8ef}.next{margin-top:23px;display:flex;justify-content:flex-end}.reflection{background:#fffdf8;border:2px solid var(--gold);border-radius:24px;padding:25px}.reflection h2{font-size:31px;margin:6px 0 8px}.reflection p{color:#506579;line-height:1.5}.q{background:var(--paper);border-radius:18px;padding:16px;margin-top:13px}.q label{font-weight:850;display:block;margin-bottom:8px}.q textarea{width:100%;min-height:78px;border:2px solid #d9cbb7;border-radius:14px;background:#fff;padding:11px;color:var(--ink);resize:vertical}.save-reflection{margin-top:18px}.stamp-earned{display:none;text-align:center;background:#fff9e9;border:2px solid var(--gold);border-radius:24px;padding:26px;margin-top:20px}.stamp-earned.show{display:block}.stamp{width:175px;height:175px;border:6px double var(--gold);border-radius:50%;display:grid;place-items:center;text-align:center;background:#fff9e9;transform:rotate(-5deg);font-weight:900;margin:15px auto}.stamp small{display:block;letter-spacing:2px}.stamp strong{display:block;font-size:23px}.finish-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}.completion-modal{position:fixed;inset:0;background:#073b5cdd;display:none;place-items:center;z-index:80;padding:20px}.completion-modal.show{display:grid}.modal{background:#fffdf8;border-radius:28px;padding:38px;max-width:520px;text-align:center}.modal h2{font-size:40px;margin:0 0 8px}.modal p{font-size:18px;color:#526579}.progress-strip{margin-top:25px;background:#eef5f4;border:1px solid #c9dfdc;border-radius:18px;padding:14px 17px;font-weight:800}.hidden{display:none!important}canvas{position:fixed;inset:0;pointer-events:none;z-index:90}
.passport-progress{margin-top:25px;background:#fffdf8;border:2px solid var(--line);border-radius:22px;padding:19px 21px}.journey-list{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:15px}.journey-item{display:flex;align-items:center;gap:8px;border:2px solid #e0d3bd;border-radius:14px;padding:10px 11px;background:#fff;color:#526579;font-size:14px;font-weight:800;line-height:1.25}.journey-item.complete{background:#f1f8f0;border-color:#9bc6a4;color:#367247}.journey-check{width:28px;height:28px;border:2px solid #cfc1a9;border-radius:8px;display:grid;place-items:center;flex:none;font-weight:950}.journey-item.complete .journey-check{background:var(--green);border-color:var(--green);color:#fff}.supported .story-card{background:#f5f9f8}.largeText .story-card p,.largeText .story-card .choice,.largeText .pathcopy,.largeText .access-panel p{font-size:110%}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.hero-inner{flex-direction:column;align-items:flex-start}.progressbox{width:100%}.pathgrid{grid-template-columns:1fr 1fr}.journey-list{grid-template-columns:1fr 1fr}}
@media(max-width:650px){header{padding:0 12px;height:68px}.brand{font-size:16px}.spark{width:34px;height:34px}.navbtn{padding:8px}.navbtn:nth-child(2){display:none}main{padding:18px 13px 45px}.hero{padding:30px 22px;border-radius:26px}.hero h1{font-size:49px}.tagline{font-size:21px}.progressbox{padding:21px}.sectionhead{display:block;margin:34px 0 17px}.sectionhead h2{font-size:33px}.grid{grid-template-columns:1fr}.card{min-height:365px}.experience-content{padding:18px 15px 32px}.expbar{padding:15px 17px;font-size:12px}.experience-hero,.experience-hero img{min-height:230px}.hero-copy{left:20px;right:18px}.hero-copy h2{font-size:43px}.hero-copy p{font-size:20px}.intro{padding:23px 2px 15px}.intro h1{font-size:40px}.intro .hook{font-size:21px}.access-panel{padding:19px}.pathgrid{grid-template-columns:1fr}.pathcard img{height:135px}.choices,.evidence{grid-template-columns:1fr}.story-card{padding:21px}.story-card h2{font-size:28px}.next{justify-content:stretch}.next .primary{width:100%}.finish-actions{flex-direction:column}.finish-actions button{width:100%}.journey-list{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="brand"><div class="spark">✦</div><span>Family Literacy Passport</span></div><nav><button class="navbtn active" id="homeNav" onclick="showHome()">Passport <span class="count" id="count">0/8</span></button><button class="navbtn" onclick="showStamps()">Stamps</button></nav></header>
<main>
<div id="homePage"></div>
<div id="experiencePage" class="experience-page"></div>
<div id="stampsPage" class="experience-page"></div>
</main>
<div id="completionModal" class="completion-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><div style="font-size:54px">🎉</div><h2 id="modalTitle">November complete!</h2><p>You earned your first passport stamp.</p><div class="stamp"><div><small>NOVEMBER</small><strong>LITERACY<br>IS ACCESS</strong><small>2026 ✓</small></div></div><strong>Progress: 1 / 8</strong><div class="finish-actions"><button class="primary" onclick="closeModalAndHome()">Return to Passport</button></div></div></div>
<canvas id="confetti"></canvas>
<script>
const stops=[
 ["November 18, 2026","Literacy Is Access","Same goal. Different paths.","Discover the many ways your child can take in information and use it to decide what to do next.","#b66a3c","A Story With Many Paths","Forest paths • warm island light • straw, sticks & bricks"],
 ["December 16, 2026","Literacy in My World","Literacy is everywhere.","Spot signs, labels, menus and symbols in everyday places.","#477b91","Winter in My World","Lights • stars • celebrations • traditions"],
 ["January 20, 2027","Choose Your Literacy","Choice increases engagement.","Explore what your child loves to read, watch, and hear.","#c99a32","New Year, New Choices","Fresh starts • possibilities • choosing your path"],
 ["February 17, 2027","Read It. Do It.","Literacy helps us do things.","Follow a recipe, a map, or a set of steps together.","#c55d72","Love, Kindness & Helping Others","Connection • kindness • doing something for someone"],
 ["March 24, 2027","Everyone Has a Voice","Communication is access.","Celebrate every way your child communicates.","#5b9b72","Find Your Voice","Expression • communication • ideas • being heard"],
 ["April 21, 2027","Find What Works","Tools can increase access.","Try tools and supports that open doors to information.","#5b8fc1","Find Your Way","Paths • maps • tools • different ways to get there"],
 ["May 19, 2027","Literacy for My Future","Literacy supports independence.","Connect literacy to work, community, and independent living.","#b27b55","What's Next?","Doors • destinations • work • community • possibility"],
 ["June 16, 2027","Our Literacy Stories","Everyone has a literacy story.","Share and celebrate your family's year of discovery.","#e29b4b","Look How Far We've Come","Summer • memories • celebration • your literacy story"]
];
const defaultState={complete:false,tasks:[false,false,false,false],houseBlocks:[],houseMaterial:"",storyStep:0,path:"",reflection:["","",""]};
let state={...defaultState,...JSON.parse(localStorage.getItem("flp")||"{}")};
state.tasks=state.tasks||[false,false,false,false];state.houseBlocks=state.houseBlocks||[];state.reflection=state.reflection||["","",""];
const save=()=>localStorage.setItem("flp",JSON.stringify(state));
const homeEl=document.getElementById("homePage"), expEl=document.getElementById("experiencePage"), stampsEl=document.getElementById("stampsPage"), countEl=document.getElementById("count");
function updateCount(){countEl.textContent=(state.complete?1:0)+"/8"}
function showHome(){expEl.classList.remove("active");stampsEl.classList.remove("active");homeEl.style.display="block";document.getElementById("homeNav").classList.add("active");renderHome();window.scrollTo(0,0)}
function renderHome(){updateCount();homeEl.innerHTML=`<section class="hero"><div class="hero-inner"><div><div class="eyebrow">HAWAIʻI · 2026–2027</div><h1>Family<br>Literacy<br>Passport</h1><div class="tagline">Explore • Experience • Grow</div><div class="subtag">A Year of Discovery Through Literacy</div></div><div class="progressbox"><div class="bigcount"><span>${state.complete?1:0}</span> / 8</div><div class="smallcaps">EXPERIENCES COMPLETE</div><div class="bar"><div style="width:${state.complete?12.5:0}%"></div></div><button class="primary" onclick="openExperience()">${state.complete?"Review November":"Start November"} →</button></div></div></section><div class="sectionhead"><div><h2>Your passport stops</h2><p>Same goal. Different paths.</p></div></div><section class="grid">${stops.map((s,i)=>`<article class="card"><div class="cardtop" style="background:${s[4]}"><span>STOP ${i+1}</span><span>${i+1}</span></div>${i===0?`<div class="cardart"><img src="assets/november-hero-art.jpg" alt="Three pigs exploring a lush island path"><div class="artlabel">${s[5]}</div></div>`:`<div class="cardart"><strong style="font-size:18px;color:#526579">${s[5]}</strong></div>`}<div class="cardbody"><div class="date">${s[0]}</div><h3>${s[1]}</h3><p class="quote" style="color:${s[4]}">“${s[2]}”</p><p class="desc">${s[3]}</p><div class="themehint">${s[6]}</div>${i===0?`<button class="status ${state.complete?'done':'ready'}" onclick="openExperience()">${state.complete?'Completed ✓':'Explore November →'}</button>`:`<button class="status">Coming soon</button>`}</div></article>`).join("")}</section>`}
function openExperience(){homeEl.style.display="none";stampsEl.classList.remove("active");expEl.classList.add("active");document.getElementById("homeNav").classList.remove("active");renderExperience();window.scrollTo(0,0)}
function renderExperience(){expEl.innerHTML=`<button class="back" onclick="showHome()">← Back to Passport</button><section class="experience-shell"><div class="expbar"><span>NOVEMBER 18, 2026</span><span>STOP 1 OF 8</span></div><div class="experience-content"><div class="experience-hero"><img src="assets/november-hero-art.jpg" alt="Three little pigs exploring a lush island landscape"><div class="hero-copy"><div class="eyebrow">NOVEMBER · STOP 1</div><h2>Literacy Is Access</h2><p>A Story With Many Paths</p></div></div><div class="intro"><h1>The Three Little Pigs</h1><p class="hook">“We all know the story… but do we?”</p><p class="intro-copy">This month, you get to explore a familiar story in more than one way. Read it. Hear it. Use supports. Look at another perspective. Make choices. There is no single “right” way to participate.</p></div><div class="access-panel"><h3>CHOOSE YOUR PATH</h3><p>Choose the way you want to access the experience. You can change your choice at any time.</p><div class="access-tools"><button class="tool" onclick="speak('We all know the story, but do we? Choose your path. You can read, hear, use supports, or explore with someone.')">🔊 Listen</button><button class="tool" onclick="toggleSupport()" id="supportBtn">${state.supported?'Hide':'Show'} access supports</button><button class="tool" onclick="toggleLargeText()">A A Larger text</button><button class="tool" onclick="speak('You can pause, talk, predict, point, choose, or communicate together.')">🤝 Explore together</button></div><div class="supportnote">Access tools are available to everyone. They are tools, not levels.</div><div class="pathgrid"><button class="pathcard ${state.path==='read'?'selected':''}" onclick="choosePath('read')"><img src="assets/november-pigs-path.jpg" alt="Small house surrounded by tropical greenery"><div class="pathcopy"><strong>Read it</strong><small>Follow the story through text.</small></div></button><button class="pathcard ${state.path==='hear'?'selected':''}" onclick="choosePath('hear')"><img src="assets/november-wolf-path.jpg" alt="Wolf looking through lush tropical leaves"><div class="pathcopy"><strong>Hear it</strong><small>Listen while you follow along.</small></div></button><button class="pathcard ${state.path==='support'?'selected':''}" onclick="choosePath('support')"><img src="assets/november-investigator-path.jpg" alt="Magnifying glass and map on an island path"><div class="pathcopy"><strong>Use supports</strong><small>Visuals, shorter chunks, key words, and cues.</small></div></button></div></div>${experienceProgress()}<div id="stageWrap" class="stage-wrap">${stageMarkup()}</div></div></section>`;applySupportClass()}
function experienceProgress(){const labels=["Explore the story","Build your house & make a choice","Consider another perspective","Complete the family reflection"];return `<section class="passport-progress" aria-label="November progress"><div style="display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap"><div><div class="chapter">YOUR NOVEMBER JOURNEY</div><strong style="font-size:22px">${state.tasks.filter(Boolean).length} of 4 complete</strong></div><div class="supportnote">You earn a small celebration each time you reach a milestone.</div></div><div class="journey-list">${labels.map((label,i)=>`<div class="journey-item ${state.tasks[i]?'complete':''}"><span class="journey-check">${state.tasks[i]?'✓':''}</span><span>${label}</span></div>`).join('')}</div></section>`}
function stageMarkup(){if(!state.path)return `<div class="story-card"><div class="chapter">START HERE</div><h2>Choose a path into the story.</h2><p>Pick any option above. You can switch at any time. Your goal is to understand, participate, and communicate—not to use one particular format.</p></div>`;return `<div id="stage1" class="stage ${state.storyStep===0?'active':''}">${houseStage()}</div><div id="stage2" class="stage ${state.storyStep===1?'active':''}">${beginningStage()}</div><div id="stage3" class="stage ${state.storyStep===2?'active':''}">${wolfStage()}</div><div id="stage4" class="stage ${state.storyStep===3?'active':''}">${evidenceStage()}</div><div id="stage5" class="stage ${state.storyStep===4?'active':''}">${voiceStage()}</div><div id="stage6" class="stage ${state.storyStep===5?'active':''}">${reflectionStage()}</div>`}
function houseStage(){return `<div class="story-card"><div class="chapter">CHAPTER 1 · BUILD YOUR HOUSE</div><h2>If you were building a house, what would you choose?</h2><p>Three little pigs made different choices. Now it’s your turn. Build a house using the materials that make sense to you.</p><div class="story-tools"><button class="tool" onclick="speak('If you were building a house, what would you choose? You can build with straw, sticks, bricks, or a combination.')">🔊 Hear the challenge</button><button class="tool" onclick="speak('Straw can be quick and easy. Sticks can be stronger. Bricks can take more time and effort, but they can be sturdy.')">🔊 Hear about the materials</button></div><div class="house"><strong>CHOOSE YOUR MATERIAL</strong><div class="materials"><button class="material ${state.houseMaterial==='straw'?'selected':''}" onclick="addMaterial('straw')"><span class="swatch straw"></span>Straw</button><button class="material ${state.houseMaterial==='sticks'?'selected':''}" onclick="addMaterial('sticks')"><span class="swatch sticks"></span>Sticks</button><button class="material ${state.houseMaterial==='bricks'?'selected':''}" onclick="addMaterial('bricks')"><span class="swatch bricks"></span>Bricks</button></div><div class="house-building"><div class="house-shape"><div class="roof"></div>${(state.houseBlocks||[]).map(m=>`<span class="block ${m}"></span>`).join('')}</div></div><p style="margin-bottom:0"><strong>${(state.houseBlocks||[]).length}</strong> pieces added. Try different materials if you want.</p><div class="choices"><button class="choice" onclick="houseReason('fast')">I want something fast and easy.</button><button class="choice" onclick="houseReason('strong')">I want something strong.</button><button class="choice" onclick="houseReason('choice')">I want to choose for myself.</button><button class="choice" onclick="houseReason('other')">I have another reason.</button></div><div id="houseFeedback" class="feedback ${state.houseReason?'':'hidden'}">${state.houseReasonText||''}</div><div class="next"><button class="primary" onclick="goStage(1)">My house is ready →</button></div></div></div>`}
function beginningStage(){return `<div class="story-card"><div class="chapter">CHAPTER 2 · THE BEGINNING</div><h2>Once upon a time…</h2><p>Three little pigs set out to build homes of their own. One pig chose straw. Another chose sticks. The third chose bricks.</p><p>Then a wolf arrived.</p><div class="story-tools"><button class="tool" onclick="speak('Three little pigs set out to build homes of their own. One pig chose straw. Another chose sticks. The third chose bricks. Then a wolf arrived.')">🔊 Listen to this part</button></div><div class="branch"><strong>Pause and predict.</strong> What do you think the pigs might do when the wolf arrives?</div><div class="choices"><button class="choice" onclick="selectChoice(this,'That is one possibility. What makes you think it?')">Build a stronger house</button><button class="choice" onclick="selectChoice(this,'That could happen too. Stories can surprise us.')">Run away</button><button class="choice" onclick="selectChoice(this,'Interesting choice. What might they say?')">Talk to the wolf</button><button class="choice" onclick="selectChoice(this,'That is a valid response. You can keep reading to find out.')">I’m not sure yet</button></div><div id="stageFeedback" class="feedback hidden"></div><div class="next"><button class="primary" onclick="goStage(2)">Continue →</button></div></div>`}
function wolfStage(){return `<div class="story-card"><div class="chapter">CHAPTER 3 · ANOTHER PERSPECTIVE</div><h2>Wait… what did the wolf say?</h2><p>In the familiar version, we mostly hear from the pigs. But what if we stop and listen to another perspective?</p><div class="social"><strong>🐺 @WolfOfficial</strong><p>“I did go to the pigs’ houses. But I wasn’t trying to hurt anyone. I was hungry, and I wanted to ask for some food.”</p></div><div class="social"><strong>🐷 @ThreeLittlePigs</strong><p>“He came to our houses and blew them down! We were scared.”</p></div><div class="branch"><strong>Think about it.</strong> Two people can experience the same event differently.</div><div class="choices"><button class="choice" onclick="selectChoice(this,'Maybe. What evidence would help you decide?')">The pigs are definitely telling the truth.</button><button class="choice" onclick="selectChoice(this,'Maybe. What evidence would help you decide?')">The wolf is definitely telling the truth.</button><button class="choice" onclick="selectChoice(this,'Excellent. Looking for evidence is part of literacy.')">I need more information.</button><button class="choice" onclick="selectChoice(this,'Yes. We can listen to more than one perspective.')">Both perspectives matter.</button></div><div id="stageFeedback" class="feedback hidden"></div><div class="next"><button class="primary" onclick="goStage(3)">Continue →</button></div></div>`}
function evidenceStage(){return `<div class="story-card"><div class="chapter">CHAPTER 4 · INVESTIGATE</div><h2>What counts as evidence?</h2><p>Which pieces of information could help you understand what really happened?</p><div class="evidence"><button onclick="selectEvidence(this)">What each character says happened</button><button onclick="selectEvidence(this)">What happened to the houses</button><button onclick="selectEvidence(this)">A comment from someone who wasn’t there</button><button onclick="selectEvidence(this)">Your favorite character</button></div><div id="evidenceFeedback" class="feedback hidden"></div><div class="branch"><strong>For readers ready for more:</strong> Compare two versions of the story. What changed because the narrator changed?</div><div class="story-tools"><button class="tool" onclick="speak('Evidence is information that helps us support an idea or understand what happened.')">🔊 Hear the key idea</button></div><div class="next"><button class="primary" onclick="goStage(4)">Continue →</button></div></div>`}
function voiceStage(){return `<div class="story-card"><div class="chapter">CHAPTER 5 · YOUR VOICE</div><h2>Now tell your version.</h2><p>Imagine the story is going viral. What would you want people to know?</p><div class="social"><strong>BREAKING: THREE HOUSES. ONE WOLF. MANY STORIES.</strong><p>Choose how you want to respond.</p></div><div class="choices"><button class="choice" onclick="selectChoice(this,'You can communicate an idea through a headline.')">Write a headline</button><button class="choice" onclick="selectChoice(this,'Choose a detail that supports your view.')">Choose the best evidence</button><button class="choice" onclick="selectChoice(this,'Pictures, symbols, and AAC can communicate ideas too.')">Tell it with pictures or symbols</button><button class="choice" onclick="selectChoice(this,'Talking it through with someone is a valid way to communicate your thinking.')">Talk it through with someone</button></div><div id="stageFeedback" class="feedback hidden"></div><div class="branch"><strong>Access matters.</strong> You can show what you understand by writing, speaking, choosing, pointing, using visuals, using AAC, or communicating another way.</div><div class="next"><button class="primary" onclick="goStage(5)">Continue to family reflection →</button></div></div>`}
function reflectionStage(){return `<div class="reflection"><div class="chapter">ALMOST THERE · FAMILY REFLECTION</div><h2>You made it through the story.</h2><p>Before you collect your passport stamp, take a moment to reflect together. There are no right answers.</p><div class="q"><label for="r1">1. What did you notice?</label><textarea id="r1" placeholder="What did your child enjoy, choose, or communicate?">${escapeHtml(state.reflection[0]||'')}</textarea></div><div class="q"><label for="r2">2. What helped your child access the experience?</label><textarea id="r2" placeholder="Audio, visuals, choices, talking together, something else…">${escapeHtml(state.reflection[1]||'')}</textarea></div><div class="q"><label for="r3">3. Anything else you want to remember?</label><textarea id="r3" placeholder="A moment, idea, question, or celebration…">${escapeHtml(state.reflection[2]||'')}</textarea></div><div class="save-reflection"><button class="primary" onclick="saveReflectionAndFinish()">Save reflection & earn my stamp →</button></div><div id="stampEarned" class="stamp-earned ${state.complete?'show':''}"><div class="smallcaps">PASSPORT STAMP EARNED</div><div class="stamp"><div><small>NOVEMBER</small><strong>LITERACY<br>IS ACCESS</strong><small>2026 ✓</small></div></div><p><strong>You explored a story, considered different perspectives, and communicated your thinking.</strong></p><div class="finish-actions"><button class="primary" onclick="showHome()">Return to Passport</button><button class="secondary" onclick="showStamps()">View Stamps</button></div></div></div>`}
function goStage(n){let milestone=false;if(n===1&&!state.tasks[1]){state.tasks[1]=true;milestone=true}if(n===3&&!state.tasks[2]){state.tasks[2]=true;milestone=true}state.storyStep=n;save();const wrap=document.getElementById('stageWrap');if(!wrap)return;[...wrap.querySelectorAll('.stage')].forEach((el,i)=>el.classList.toggle('active',i===n));updateJourney();if(n===5){const r1=document.getElementById('r1');if(r1){r1.value=state.reflection[0]||'';document.getElementById('r2').value=state.reflection[1]||'';document.getElementById('r3').value=state.reflection[2]||''}}if(milestone){popSound();confetti(45)}}
function updateJourney(){const items=document.querySelectorAll('.journey-item');items.forEach((el,i)=>{el.classList.toggle('complete',!!state.tasks[i]);const c=el.querySelector('.journey-check');if(c)c.textContent=state.tasks[i]?'✓':''});const strong=document.querySelector('.passport-progress strong');if(strong)strong.textContent=`${state.tasks.filter(Boolean).length} of 4 complete`}
function choosePath(path){state.path=path;state.storyStep=0;let milestone=!state.tasks[0];state.tasks[0]=true;save();renderExperience();setTimeout(()=>document.getElementById('stageWrap')?.scrollIntoView({behavior:'smooth',block:'start'}),30);if(milestone){popSound();confetti(35)}else popSound()}
function addMaterial(m){state.houseMaterial=m;state.houseBlocks=state.houseBlocks||[];if(state.houseBlocks.length<8)state.houseBlocks.push(m);save();const stage=document.getElementById('stage1');if(stage){stage.outerHTML=`<div id="stage1" class="stage active">${houseStage()}</div>`}popSound();confetti(22)}
function houseReason(type){const msgs={fast:'That makes sense. Sometimes people value speed, time, or less work.',strong:'That makes sense. Strength and safety can matter.',choice:'Choice matters. You get to decide what works for you.',other:'Your reason matters too. Different people can make different choices.'};state.houseReason=type;state.houseReasonText=msgs[type];save();const f=document.getElementById('houseFeedback');if(f){f.textContent=msgs[type];f.classList.remove('hidden')}popSound()}
function selectChoice(btn,msg){btn.parentElement.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');const f=btn.parentElement.nextElementSibling;if(f&&f.id==='stageFeedback'){f.textContent=msg;f.classList.remove('hidden')}popSound()}
function selectEvidence(btn){btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');const f=document.getElementById('evidenceFeedback');f.textContent='Evidence gives us information we can use to understand a story and support our thinking. Different pieces of evidence can be useful in different ways.';f.classList.remove('hidden');popSound()}
function toggleSupport(){state.supported=!state.supported;save();applySupportClass();const b=document.getElementById('supportBtn');if(b)b.textContent=state.supported?'Hide access supports':'Show access supports'}
function applySupportClass(){document.body.classList.toggle('supported',!!state.supported)}
function toggleLargeText(){document.body.classList.toggle('largeText');if(document.body.classList.contains('largeText'))document.body.style.fontSize='110%';else document.body.style.fontSize=''}
function saveReflectionAndFinish(){const vals=[document.getElementById('r1')?.value||'',document.getElementById('r2')?.value||'',document.getElementById('r3')?.value||''];state.reflection=vals;state.tasks[3]=true;state.complete=true;save();document.getElementById('stampEarned')?.classList.add('show');updateCount();updateJourney();applauseSound();confetti(180);setTimeout(()=>document.getElementById('stampEarned')?.scrollIntoView({behavior:'smooth',block:'center'}),120);setTimeout(showCompletionModal,700)}
function showCompletionModal(){document.getElementById('completionModal').classList.add('show');confetti(180)}
function closeModalAndHome(){document.getElementById('completionModal').classList.remove('show');showHome()}
function showStamps(){homeEl.style.display='none';expEl.classList.remove('active');stampsEl.classList.add('active');document.getElementById('homeNav').classList.remove('active');stampsEl.innerHTML=`<button class="back" onclick="showHome()">← Back to Passport</button><section class="experience-shell"><div class="experience-content"><div class="chapter">YOUR PASSPORT</div><h1 style="font-size:clamp(40px,6vw,60px);margin:10px 0">Your Stamps</h1><p style="font-size:18px;color:#506579">Each completed experience earns a digital stamp.</p><div class="stamp-earned show"><div class="stamp"><div><small>NOVEMBER</small><strong>LITERACY<br>IS ACCESS</strong><small>${state.complete?'2026 ✓':'LOCKED'}</small></div></div><p><strong>${state.complete?'Your first passport stamp is yours!':'Complete the November experience to earn your first stamp.'}</strong></p></div><div class="progress-strip"><strong>Passport progress:</strong> ${state.complete?'1':'0'} / 8 experiences complete</div><div style="margin-top:24px"><button class="secondary" onclick="resetTestPassport()">Reset this test passport</button><p style="font-size:13px;color:#8a8a8a">For testing only. Resets progress saved on this browser.</p></div></div></section>`;window.scrollTo(0,0)}
function resetTestPassport(){if(!confirm('Reset this browser’s Family Literacy Passport test progress back to 0/8?'))return;localStorage.removeItem('flp');state={...defaultState,tasks:[false,false,false,false],houseBlocks:[],reflection:['','','']};showHome()}
function escapeHtml(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
let speechTimer=null;
function speak(t){if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){alert('Audio is not available in this browser. Try Chrome or Safari.');return}const synth=window.speechSynthesis;if(speechTimer)clearTimeout(speechTimer);synth.cancel();const play=()=>{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.92;const voices=synth.getVoices();const v=voices.find(v=>v.lang&&v.lang.toLowerCase()==='en-us')||voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('en'));if(v)u.voice=v;synth.resume();synth.speak(u);speechTimer=setTimeout(()=>{if(!synth.speaking)synth.speak(u)},700)};if(synth.getVoices().length)play();else{const old=synth.onvoiceschanged;synth.onvoiceschanged=()=>{synth.onvoiceschanged=old||null;play()};speechTimer=setTimeout(play,800);synth.getVoices()}}
function audioCtx(){window.__flpAudio=window.__flpAudio||new (window.AudioContext||window.webkitAudioContext)();if(window.__flpAudio.state==='suspended')window.__flpAudio.resume();return window.__flpAudio}
function popSound(){try{const c=audioCtx(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type='sine';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(900,t+.09);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.13);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.14)}catch(e){}}
function applauseSound(){try{const c=audioCtx(),t=c.currentTime;for(let i=0;i<7;i++){const b=c.createBuffer(1,c.sampleRate*.11,c.sampleRate),d=b.getChannelData(0);for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*(1-j/d.length);const s=c.createBufferSource(),g=c.createGain();s.buffer=b;g.gain.setValueAtTime(.0001,t+i*.055);g.gain.exponentialRampToValueAtTime(.12,t+i*.055+.01);g.gain.exponentialRampToValueAtTime(.0001,t+i*.055+.1);s.connect(g).connect(c.destination);s.start(t+i*.055)}}catch(e){}}
function confetti(n){const c=document.getElementById('confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let p=Array.from({length:n},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*12-3,s:Math.random()*8+4,r:Math.random()*6})),st=performance.now();function f(t){x.clearRect(0,0,c.width,c.height);p.forEach(a=>{a.x+=a.vx;a.vy+=.45;a.y+=a.vy;a.r+=.2;x.save();x.translate(a.x,a.y);x.rotate(a.r);x.fillStyle=['#f15a3c','#ffbd3f','#2fa7a5','#58a56b','#4ba2d0','#d84b79'][Math.floor(Math.random()*6)];x.fillRect(-a.s/2,-a.s/2,a.s,a.s*1.6);x.restore()});if(t-st<1300)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)}requestAnimationFrame(f)}
showHome();
</script>
</body>
</html>
