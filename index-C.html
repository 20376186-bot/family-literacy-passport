const homeEl=document.getElementById("homePage"), expEl=document.getElementById("experiencePage"), stampsEl=document.getElementById("stampsPage"), countEl=document.getElementById("count");
function updateCount(){countEl.textContent=(state.complete?1:0)+"/8"}
function showHome(){expEl.classList.remove("active");stampsEl.classList.remove("active");homeEl.style.display="block";document.getElementById("homeNav").classList.add("active");renderHome();window.scrollTo(0,0)}
function renderHome(){updateCount();homeEl.innerHTML=`<section class="hero"><div class="hero-inner"><div><div class="eyebrow">HAWAIʻI · 2026–2027</div><h1>Family<br>Literacy<br>Passport</h1><div class="tagline">Explore • Experience • Grow</div><div class="subtag">A Year of Discovery Through Literacy</div></div><div class="progressbox"><div class="bigcount"><span>${state.complete?1:0}</span> / 8</div><div class="smallcaps">EXPERIENCES COMPLETE</div><div class="bar"><div style="width:${state.complete?12.5:0}%"></div></div><button class="primary" onclick="openExperience()">${state.complete?"Review November":"Start November"} →</button></div></div></section><div class="sectionhead"><div><h2>Your passport stops</h2><p>Same goal. Different paths.</p></div></div><section class="grid">${stops.map((s,i)=>`<article class="card"><div class="cardtop" style="background:${s[3]}"><span>STOP ${i+1}</span><span>${i+1}</span></div>${i===0?`<div class="cardart"><img src="assets/november-hero-art.jpg" alt="Three pigs exploring a lush island path"><div class="artlabel">A Story With Many Paths</div></div>`:`<div class="cardart"><strong style="font-size:18px;color:#526579">Coming soon</strong></div>`}<div class="cardbody"><div class="date">${s[0]}</div><h3>${s[1]}</h3><p class="quote" style="color:${s[3]}">“${s[2]}”</p>${i===0?`<button class="status ${state.complete?'done':'ready'}" onclick="openExperience()">${state.complete?'Completed ✓':'Explore November →'}</button>`:`<button class="status">Coming soon</button>`}</div></article>`).join("")}</section>`}
function openExperience(){homeEl.style.display="none";stampsEl.classList.remove("active");expEl.classList.add("active");document.getElementById("homeNav").classList.remove("active");renderExperience();window.scrollTo(0,0)}
function renderExperience(){
expEl.innerHTML=`<button class="back" onclick="showHome()">← Back to Passport</button><section class="experience-shell"><div class="expbar"><span>NOVEMBER 18, 2026</span><span>STOP 1 OF 8</span></div><div class="experience-content"><div class="experience-hero"><img src="assets/november-hero-art.jpg" alt="Three little pigs exploring a lush island landscape"><div class="hero-copy"><div class="eyebrow">NOVEMBER · STOP 1</div><h2>Literacy Is Access</h2><p>A Story With Many Paths</p></div></div><div class="intro"><h1>The Three Little Pigs</h1><p class="hook">“We all know the story… but do we?”</p><p class="intro-copy">The same story can be accessed in different ways. Choose the tools that help you. You can change them at any time.</p></div><div class="access-panel"><h3>YOUR ACCESS TOOLS</h3><p>Use any of these whenever they help. Everyone can use every tool.</p><div class="access-tools"><button class="tool" onclick="speakCurrent()">🔊 Hear</button><button class="tool" onclick="toggleSupport()" id="supportBtn">👀 Show me</button><button class="tool" onclick="toggleTextSize(-1)">A−</button><button class="tool" onclick="toggleTextSize(0)">A</button><button class="tool" onclick="toggleTextSize(1)">A+</button><button class="tool" onclick="speak('Explore together. A family member, teacher, or communication partner can read, model, point, or talk with you.')">🤝 Together</button><button class="tool" onclick="repeatDirection()">🔁 Again</button></div><div class="supportnote">You never have to pick a support level. Use what helps you access the information and participate.</div></div><div class="stage-wrap">${!state.started?startStory():pathChooser()}</div>${state.started&&state.path?`<div class="experience-layout"><div><div id="stageWrap" class="stage-wrap">${stageMarkup()}</div></div>${experienceProgress()}</div>`:''}</div></section>`;
applySupportClass();
}
function startStory(){return `<div class="story-card"><div class="chapter">LET’S BEGIN</div><h2>First, meet the story.</h2><p>Three pigs set out to build homes of their own.</p><div class="story-text"><p><strong>The Three Little Pigs</strong></p><p>The three pigs decided it was time to build homes of their own. Each pig chose a different way to build a house.</p></div><div class="story-tools"><button class="tool" onclick="speak('The three pigs decided it was time to build homes of their own. Each pig chose a different way to build a house.')">🔊 Hear this</button><button class="tool" onclick="toggleSupport()">👀 Show me</button><button class="tool" onclick="speak('The three pigs decided it was time to build homes of their own. Each pig chose a different way to build a house.')">🔁 Again</button></div><div class="next"><button class="primary" onclick="beginStory()">Continue →</button></div></div>`}
function pathChooser(){return `<div class="story-card"><div class="chapter">NOW CHOOSE WHAT YOU WANT TO EXPLORE</div><h2>What would you like to explore?</h2><p>You have enough of the story to choose. There is no right path, and you can explore more later.</p><div class="pathgrid"><button class="pathcard" onclick="choosePath('experience')"><img src="IMG["straw.jpg"]" alt="A simple house surrounded by tropical greenery"><div class="pathcopy"><strong>🌺 Experience the Story</strong><small>Make choices, build, and see what happens.</small></div></button><button class="pathcard" onclick="choosePath('perspective')"><img src="IMG["wolf-house.jpg"]" alt="A wolf looking through lush tropical leaves"><div class="pathcopy"><strong>🐺 Hear Another Side</strong><small>Hear what the pigs and the wolf each say happened.</small></div></button><button class="pathcard" onclick="choosePath('investigate')"><img src="assets/november-investigator-path.jpg" alt="A magnifying glass and map on an island path"><div class="pathcopy"><strong>🔎 Investigate the Story</strong><small>Compare information, look for evidence, and decide what you think.</small></div></button></div><p class="supportnote"><strong>Not sure?</strong> Start with Experience the Story. You can change your mind later.</p></div>`}
function beginStory(){if(!state.started){state.started=true;state.storyStep=0;save();renderExperience();setTimeout(()=>document.getElementById('stageWrap')?.focus?.({preventScroll:true}),0)}}
function experienceProgress(){const labels=state.path==='experience'?['Access the story','Build a house','Make a story choice','Family reflection']:state.path==='perspective'?['Access the story','Hear both perspectives','Share your thinking','Family reflection']:['Access the story','Learn and examine','Use evidence and communicate','Family reflection'];return `<aside class="journey-rail" aria-label="November journey"><div class="chapter">YOUR NOVEMBER JOURNEY</div><div class="rail-count">${state.tasks.filter(Boolean).length} of 4 complete</div>${labels.map((label,i)=>`<div class="rail-item ${state.tasks[i]?'done':''}"><span class="rail-dot">${state.tasks[i]?'✓':''}</span><span>${label}</span></div>`).join('')}</aside>`}

function stageMarkup(){if(state.path==='experience')return `<div id="stage1" class="stage ${state.storyStep===0?'active':''}">${experienceStory1()}</div><div id="stage2" class="stage ${state.storyStep===1?'active':''}">${experienceStory2()}</div><div id="stage3" class="stage ${state.storyStep===2?'active':''}">${experienceStory3()}</div><div id="stage4" class="stage ${state.storyStep===3?'active':''}">${reflectionStage()}</div>`;if(state.path==='perspective')return `<div id="stage1" class="stage ${state.storyStep===0?'active':''}">${perspective1()}</div><div id="stage2" class="stage ${state.storyStep===1?'active':''}">${perspective2()}</div><div id="stage3" class="stage ${state.storyStep===2?'active':''}">${perspective3()}</div><div id="stage4" class="stage ${state.storyStep===3?'active':''}">${reflectionStage()}</div>`;return `<div id="stage1" class="stage ${state.storyStep===0?'active':''}">${investigate1()}</div><div id="stage2" class="stage ${state.storyStep===1?'active':''}">${investigate2()}</div><div id="stage3" class="stage ${state.storyStep===2?'active':''}">${investigate3()}</div><div id="stage4" class="stage ${state.storyStep===3?'active':''}">${reflectionStage()}</div>`}
function accessLine(text){return `<div class="story-tools"><button class="tool" onclick="speak(${JSON.stringify(text)})">🔊 Hear it</button><button class="tool" onclick="showAccessSupport(${JSON.stringify(text)})">👀 Show me</button><button class="tool" onclick="speak(${JSON.stringify(text)})">🔁 Again</button></div><div id="accessVisual" class="access-visual" aria-live="polite"></div>`}

nk might happen?</span></div><div class="activity3-blow-image"><img src="${IMG["wolf-blows-house.jpg"]}" alt="The wolf blowing toward the house"><strong>Wolf + house</strong><span>Look at the picture while you think.</span></div><div class="visual-choice-grid prediction-grid"><button class="visual-choice" onclick="chooseStory3(1,this,'The house might stay.')"><img src="${IMG["house-stays.jpg"]}" alt="A house still standing"><strong>It might stay.</strong></button><button class="visual-choice" onclick="chooseStory3(1,this,'The house might fall.')"><img src="${IMG["house-falls.jpg"]}" alt="A house that has fallen"><strong>It might fall.</strong></button><button class="visual-choice no-image" onclick="chooseStory3(1,this,'It is okay not to know yet.')"><div class="question-visual">?</div><strong>I’m not sure.</strong><span>It is okay to keep thinking.</span></button></div><div id="choice2Feedback" class="feedback hidden"></div><div class="next"><button id="activity3Done" class="primary" onclick="completeActivity(2,3)" disabled>Continue to reflection →</button></div><div id="activity3Celebrate" class="local-celebration"><span class="local-confetti"><i></i><i></i><i></i><i></i></span>Activity complete — you made choices and predicted what might happen.</div></div>`}

function selectChoice(btn,msg){btn.parentElement.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');const f=btn.parentElement.nextElementSibling;if(f&&f.classList.contains('feedback')){f.textContent=msg;f.classList.remove('hidden')}const stage=btn.closest('.stage');if(stage?.querySelector('#activity1Done')){const hasAccess=!!stage.querySelector('#stageFeedback')?.textContent;stage.querySelector('#activity1Done').disabled=!hasAccess}}
function chooseStory3(group,btn,msg){const card=btn.closest('.story-card'),groups=card.querySelectorAll('.choices');groups[group].querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');const f=document.getElementById(group===0?'choice1Feedback':'choice2Feedback');f.textContent=msg;f.classList.remove('hidden');const done=!!groups[0].querySelector('.choice.selected')&&!!groups[1].querySelector('.choice.selected');document.getElementById('activity3Done').disabled=!done;if(done)document.getElementById('activity3Celebrate').classList.add('show')}
function showStageVisual(kind){const p=document.getElementById('stageVisual');if(!p)return;p.classList.remove('hidden');p.innerHTML=`<h4>👀 SHOW ME</h4><div class="showme-feature"><img src="${IMG["wolf-house.jpg"]}" alt="A wolf approaching a house"><div><strong>🐺 Wolf + 🏠 House</strong><p>The wolf comes to the house and asks to come in.</p></div></div>`}
function selectEvidence(btn){btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');const f=document.getElementById('evidenceFeedback');if(f){f.textContent='This is information you can use to think about the story. Ask: Who said it? What happened? Can we check it?';f.classList.remove('hidden')}}
function toggleSupport(){state.supported=!state.supported;save();applySupportClass();const b=document.getElementById('supportBtn');if(b)b.textContent=state.supported?'👀 Hide visual supports':'👀 Show me';const stage=document.querySelector('.stage.active');if(stage&&state.supported)showUniversalVisual(stage);else {const card=document.querySelector('.stage-wrap .story-card');if(card&&state.supported)showUniversalVisual(card);else document.getElementById('universalVisual')?.classList.add('hidden')}}
function showUniversalVisual(stage){let p=document.getElementById('universalVisual');if(!p){p=document.createElement('div');p.id='universalVisual';p.className='access-visual-panel'};(stage.querySelector?.('.story-card')||stage).appendChild(p);const text=(stage.innerText||'').toLowerCase();if(text.includes('wolf'))p.innerHTML=`<h4>👀 SHOW ME</h4><div class="showme-feature"><img src="${IMG["wolf-house.jpg"]}" alt="A wolf approaching a house"><div><strong>🐺 Wolf + 🏠 House</strong><p>The wolf comes to the house. The picture shows the same information in another way.</p></div></div>`;else if(text.includes('house')||text.includes('straw')||text.includes('sticks')||text.includes('bricks'))p.innerHTML=`<h4>👀 SHOW ME</h4><div class="showme-grid"><div><img src="${IMG["straw.jpg"]}" alt="Pig beside straw house"><strong>🌾 STRAW</strong><span>Dried plants used to build.</span></div><div><img src="${IMG["sticks.jpg"]}" alt="Pig beside stick house"><strong>🪵 STICKS</strong><span>Pieces of wood used to build.</span></div><div><img src="${IMG["bricks.jpg"]}" alt="Pig beside brick house"><strong>🧱 BRICKS</strong><span>Hard blocks used to build.</span></div></div>`;else p.innerHTML=`<h4>👀 SHOW ME</h4><div class="showme-feature"><img src="${IMG["straw.jpg"]}" alt="Pig beside a straw house"><div><strong>🐷 Pig + 🏠 House</strong><p>The picture supports the information on this screen.</p></div></div>`;p.classList.remove('hidden')}
function applySupportClass(){document.body.classList.toggle('supported',!!state.supported)}
function toggleTextSize(direction){let level=Number(document.body.dataset.textSize||0)+direction;level=Math.max(-1,Math.min(2,level));document.body.dataset.textSize=level;document.body.classList.toggle('largeText',level!==0);document.body.style.fontSize=level===-1?'95%':level===1?'110%':level===2?'120%':''}
function saveReflectionAndFinish(){const vals=[document.getElementById('r1')?.value||'',document.getElementById('r2')?.value||'',document.getElementById('r3')?.value||''];state.reflection=vals;state.complete=true;save();completeTask(3);document.getElementById('stampEarned')?.classList.add('show');updateCount();updateJourney();confetti(180);gentleApplause();setTimeout(()=>document.getElementById('stampEarned')?.scrollIntoView({behavior:'smooth',block:'center'}),120);setTimeout(showCompletionModal,700)}
function showCompletionModal(){document.getElementById('completionModal').classList.add('show');confetti(180)}
function closeModalAndHome(){document.getElementById('completionModal').classList.remove('show');showHome()}
function showStamps(){homeEl.style.display='none';expEl.classList.remove('active');stampsEl.classList.add('active');document.getElementById('homeNav').classList.remove('active');stampsEl.innerHTML=`<button class="back" onclick="showHome()">← Back to Passport</button><section class="experience-shell"><div class="experience-content"><div class="chapter">YOUR PASSPORT</div><h1 style="font-size:clamp(40px,6vw,60px);margin:10px 0">Your Stamps</h1><p style="font-size:18px;color:#506579">Each completed experience earns a digital stamp.</p><div class="stamp-earned show"><div class="stamp"><div><small>NOVEMBER</small><strong>LITERACY<br>IS ACCESS</strong><small>${state.complete?'2026 ✓':'LOCKED'}</small></div></div><p><strong>${state.complete?'Your first passport stamp is yours!':'Complete the November experience to earn your first stamp.'}</strong></p></div><div class="progress-strip"><strong>Passport progress:</strong> ${state.complete?'1':'0'} / 8 experiences complete</div><div style="margin-top:24px"><button class="secondary" onclick="resetTestPassport()">Reset this test passport</button><p style="font-size:13px;color:#8a8a8a">For testing only. Resets progress saved on this browser.</p></div></div></section>`;window.scrollTo(0,0)}
function resetTestPassport(){if(!confirm('Reset this browser’s Family Literacy Passport test progress back to 0/8?'))return;localStorage.removeItem('flp');state={...defaultState,tasks:[false,false,false,false],houseBlocks:[],houseBuilt:false,reflection:['','',''],started:false};showHome()}
function escapeHtml(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
let speechTimer=null;
function speak(t){if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){alert('Audio is not available in this browser. Try Chrome or Safari.');return}const synth=window.speechSynthesis;if(speechTimer)clearTimeout(speechTimer);synth.cancel();const play=()=>{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.92;const voices=synth.getVoices();const v=voices.find(v=>v.lang&&v.lang.toLowerCase()==='en-us')||voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('en'));if(v)u.voice=v;synth.resume();synth.speak(u);speechTimer=setTimeout(()=>{if(!synth.speaking)synth.speak(u)},700)};if(synth.getVoices().length)play();else{const old=synth.onvoiceschanged;synth.onvoiceschanged=()=>{synth.onvoiceschanged=old||null;play()};speechTimer=setTimeout(play,800);synth.getVoices()}}
function audioCtx(){window.__flpAudio=window.__flpAudio||new (window.AudioContext||window.webkitAudioContext)();if(window.__flpAudio.state==='suspended')window.__flpAudio.resume();return window.__flpAudio}
function popSound(){try{const c=audioCtx(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type='sine';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(900,t+.09);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.13);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.14)}catch(e){}}
function gentleApplause(){try{const c=audioCtx(),t=c.currentTime;for(let i=0;i<12;i++){const b=c.createBuffer(1,c.sampleRate*.16,c.sampleRate),d=b.getChannelData(0);for(let j=0;j<d.length;j++){const fade=Math.sin(Math.PI*j/d.length);d[j]=(Math.random()*2-1)*fade*.16}const src=c.createBufferSource(),filter=c.createBiquadFilter(),g=c.createGain();src.buffer=b;filter.type='lowpass';filter.frequency.value=1700;g.gain.setValueAtTime(.0001,t+i*.13);g.gain.exponentialRampToValueAtTime(.045,t+i*.13+.025);g.gain.exponentialRampToValueAtTime(.0001,t+i*.13+.12);src.connect(filter).connect(g).connect(c.destination);src.start(t+i*.13)}}catch(e){}}
function confetti(n){const c=document.getElementById('confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let p=Array.from({length:n},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*12-3,s:Math.random()*8+4,r:Math.random()*6})),st=performance.now();function f(t){x.clearRect(0,0,c.width,c.height);p.forEach(a=>{a.x+=a.vx;a.vy+=.45;a.y+=a.vy;a.r+=.2;x.save();x.translate(a.x,a.y);x.rotate(a.r);x.fillStyle=['#f15a3c','#ffbd3f','#2fa7a5','#58a56b','#4ba2d0','#d84b79'][Math.floor(Math.random()*6)];x.fillRect(-a.s/2,-a.s/2,a.s,a.s*1.6);x.restore()});if(t-st<1300)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)}requestAnimationFrame(f)}
showHome();
</script>
